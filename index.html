<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MNM Premier League</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
  :root {
    --paper: #f4f6f2;
    --surface: #ffffff;
    --surface-2: #eceee7;
    --ink: #142019;
    --ink-muted: #5b6b60;
    --pitch: #1c7a4a;
    --pitch-deep: #0f4f30;
    --pitch-soft: #e4f2e9;
    --gold: #a97a17;
    --gold-soft: #f7ecd4;
    --line: #dde2da;
    --relegation: #ac4331;
    --relegation-soft: #f8e6e2;
    --europa: #33628f;
    --europa-soft: #e5edf5;
    --field-tint: rgba(28, 122, 74, 0.075);
    --floodlight: rgba(255, 255, 255, 0.65);
    --pitch-line: rgba(28, 122, 74, 0.12);
    --shadow: 0 1px 2px rgba(15, 30, 20, 0.06), 0 6px 16px -8px rgba(15, 30, 20, 0.18);
    --on-accent: #ffffff;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #0e1712;
      --surface: #16211b;
      --surface-2: #1c2921;
      --ink: #eef1ec;
      --ink-muted: #9caa9f;
      --pitch: #4fcf8c;
      --pitch-deep: #3fb579;
      --pitch-soft: #1b3327;
      --gold: #e0b23c;
      --gold-soft: #33301a;
      --line: #263229;
      --relegation: #e2705a;
      --relegation-soft: #34211c;
      --europa: #7fb0e0;
      --europa-soft: #1c2c3a;
      --field-tint: rgba(79, 207, 140, 0.085);
      --floodlight: rgba(255, 255, 255, 0.09);
      --pitch-line: rgba(79, 207, 140, 0.16);
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.35), 0 10px 24px -12px rgba(0, 0, 0, 0.55);
      --on-accent: #0b1f16;
    }
  }

  :root[data-theme="dark"] {
    --paper: #0e1712;
    --surface: #16211b;
    --surface-2: #1c2921;
    --ink: #eef1ec;
    --ink-muted: #9caa9f;
    --pitch: #4fcf8c;
    --pitch-deep: #3fb579;
    --pitch-soft: #1b3327;
    --gold: #e0b23c;
    --gold-soft: #33301a;
    --line: #263229;
    --relegation: #e2705a;
    --relegation-soft: #34211c;
    --europa: #7fb0e0;
    --europa-soft: #1c2c3a;
    --field-tint: rgba(79, 207, 140, 0.085);
    --floodlight: rgba(255, 255, 255, 0.09);
    --pitch-line: rgba(79, 207, 140, 0.16);
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.35), 0 10px 24px -12px rgba(0, 0, 0, 0.55);
    --on-accent: #0b1f16;
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    background-color: var(--paper);
    background-image:
      radial-gradient(380px 240px at 6% -8%, var(--floodlight), transparent 62%),
      radial-gradient(380px 240px at 94% -8%, var(--floodlight), transparent 62%),
      radial-gradient(circle at 50% 34%, transparent 0 84px, var(--pitch-line) 84px 86px, transparent 86px 100%),
      linear-gradient(var(--pitch-line), var(--pitch-line)),
      repeating-linear-gradient(135deg, var(--field-tint) 0 26px, transparent 26px 52px);
    background-repeat: no-repeat, no-repeat, no-repeat, no-repeat, repeat;
    background-position: 0 0, 0 0, 0 0, center 34%, 0 0;
    background-size: auto, auto, auto, 100% 2px, auto;
    background-attachment: fixed, fixed, fixed, fixed, scroll;
    color: var(--ink);
    font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
    padding-inline: 16px;
    padding-block: 14px 96px;
    display: flex;
    justify-content: center;
  }

  .app {
    width: 100%;
    max-width: 440px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  /* ---------- header ---------- */

  .header {
    position: sticky;
    top: env(safe-area-inset-top, 0px);
    z-index: 5;
    background: var(--paper);
    padding-block: 6px 4px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .pitch-banner {
    position: relative;
    height: 92px;
    border-radius: 16px;
    overflow: hidden;
    background: var(--surface);
    box-shadow: var(--shadow);
  }

  .banner-content {
    position: relative;
    z-index: 1;
    height: 100%;
    padding: 0 16px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 2px;
  }

  .banner-eyebrow {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 0.62rem;
    font-weight: 500;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--pitch-deep);
  }

  .league-logo {
    display: block;
    height: 54px;
    width: auto;
    max-width: 78%;
    object-fit: contain;
    object-position: left center;
    filter: drop-shadow(0 1px 3px rgba(0, 0, 0, 0.12));
  }

  /* ---------- grass strip ---------- */

  .field-strip {
    position: relative;
    height: 16px;
    flex-shrink: 0;
    border-radius: 8px;
    overflow: hidden;
    background: repeating-linear-gradient(115deg, var(--pitch) 0 14px, var(--pitch-deep) 14px 28px);
    box-shadow: var(--shadow);
  }

  .field-strip-lines {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }

  .eyebrow {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 0.68rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-muted);
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    row-gap: 6px;
    column-gap: 6px;
  }

  .example-badge {
    font-family: "Inter", sans-serif;
    font-size: 0.66rem;
    letter-spacing: 0.02em;
    text-transform: none;
    color: var(--gold);
    background: var(--gold-soft);
    border-radius: 999px;
    padding: 2px 8px;
    white-space: nowrap;
  }

  /* ---------- primary action row (match entry / end season) ---------- */

  .action-row {
    display: flex;
    gap: 8px;
  }

  .action-row button {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    min-height: 46px;
    font-family: "Inter", sans-serif;
    font-size: 0.84rem;
    font-weight: 700;
    letter-spacing: 0.01em;
    text-transform: none;
    border: none;
    border-radius: 13px;
    padding: 0 14px;
    white-space: nowrap;
  }

  .end-btn {
    color: var(--on-accent);
    background: var(--gold);
    box-shadow: 0 6px 14px -8px rgba(169, 122, 23, 0.6);
  }
  .end-btn svg { width: 17px; height: 17px; }

  .match-btn {
    color: var(--on-accent);
    background: var(--pitch);
    box-shadow: 0 6px 14px -8px rgba(28, 122, 74, 0.55);
  }
  .match-btn svg { width: 17px; height: 17px; }

  /* ---------- tab bar ---------- */

  .tabbar {
    display: flex;
    gap: 4px;
    background: var(--surface-2);
    border-radius: 12px;
    padding: 4px;
  }

  .tab-btn {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    font-family: "Inter", sans-serif;
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--ink-muted);
    background: transparent;
    border: none;
    border-radius: 9px;
    padding: 9px 0;
    white-space: nowrap;
  }
  .tab-btn.active {
    background: var(--surface);
    color: var(--ink);
    box-shadow: var(--shadow);
  }
  .tab-count {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 0.68rem;
    color: inherit;
    opacity: 0.7;
  }

  /* ---------- season history ---------- */

  .history-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .history-entry {
    display: flex;
    flex-direction: column;
    gap: 10px;
    background: linear-gradient(135deg, var(--gold-soft), var(--surface) 55%);
    border: 1px solid var(--gold);
    border-radius: 14px;
    padding: 12px 14px 14px;
    box-shadow: var(--shadow);
  }

  .history-top {
    display: flex;
    align-items: center;
    gap: 12px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }

  .history-top .crest-lg { flex-shrink: 0; }

  .history-chevron {
    width: 16px;
    height: 16px;
    color: var(--ink-muted);
    flex-shrink: 0;
    margin-left: auto;
    transition: transform 0.18s ease;
  }
  .history-entry.open .history-chevron { transform: rotate(180deg); }

  .champion-info { display: flex; flex-direction: column; gap: 2px; min-width: 0; }

  .champion-eyebrow {
    display: flex;
    align-items: center;
    gap: 5px;
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 0.64rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--gold);
  }
  .champion-eyebrow svg { width: 13px; height: 13px; flex-shrink: 0; }

  .champion-name {
    font-family: "Oswald", "Arial Narrow", sans-serif;
    font-weight: 600;
    font-size: 1.1rem;
    color: var(--ink);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .champion-record {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 0.7rem;
    color: var(--ink-muted);
  }

  /* ---------- season history: edit / delete detail ---------- */

  .history-detail {
    display: grid;
    grid-template-rows: 0fr;
    transition: grid-template-rows 0.2s ease;
  }
  .history-entry.open .history-detail { grid-template-rows: 1fr; }
  .history-detail-inner { overflow: hidden; }

  .history-body {
    padding-top: 10px;
    margin-top: 2px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .h-team-block {
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding-top: 10px;
    border-top: 1px solid var(--line);
  }
  .h-team-block:first-child { padding-top: 0; border-top: none; }

  .h-team-head {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .h-rank-badge {
    width: 16px;
    flex-shrink: 0;
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 0.7rem;
    font-weight: 700;
    color: var(--ink-muted);
    text-align: center;
    font-variant-numeric: tabular-nums;
  }

  .crest-lg {
    width: 56px;
    height: 62px;
    clip-path: polygon(50% 0%, 100% 16%, 100% 62%, 50% 100%, 0% 62%, 0% 16%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Oswald", "Arial Narrow", sans-serif;
    font-weight: 700;
    font-size: 1.2rem;
    color: #fff;
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
    box-shadow: inset 0 0 0 1.5px rgba(255, 255, 255, 0.25), 0 4px 10px -4px rgba(0, 0, 0, 0.35);
  }

  /* ---------- champion modal ---------- */

  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(10, 16, 12, 0.58);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 50;
    animation: fade-in 0.15s ease;
  }

  .modal-card {
    position: relative;
    width: 100%;
    max-width: 340px;
    background: var(--surface);
    border-radius: 20px;
    padding: 28px 22px 22px;
    box-shadow: 0 24px 48px -16px rgba(0, 0, 0, 0.45);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    text-align: center;
    overflow: hidden;
    animation: pop-in 0.22s cubic-bezier(0.2, 0.9, 0.3, 1.2);
  }

  .modal-field {
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(90deg, var(--pitch-soft) 0 18px, transparent 18px 36px);
    opacity: 0.5;
    z-index: 0;
  }

  .confetti-dot {
    position: absolute;
    border-radius: 50%;
    opacity: 0.8;
  }

  .modal-inner { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; gap: 10px; width: 100%; }

  .modal-trophy { width: 46px; height: 46px; color: var(--gold); }
  .modal-match-icon { width: 40px; height: 40px; color: var(--pitch); }

  .modal-eyebrow {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 0.68rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--gold);
  }

  .modal-crest { margin: 2px 0; }

  .modal-name {
    font-family: "Oswald", "Arial Narrow", sans-serif;
    font-weight: 700;
    font-size: 1.5rem;
    letter-spacing: 0.01em;
    color: var(--ink);
    text-wrap: balance;
  }

  .modal-record {
    display: flex;
    gap: 12px;
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 0.76rem;
    color: var(--ink-muted);
  }
  .modal-record b { color: var(--ink); font-weight: 700; }

  .modal-empty { color: var(--ink-muted); font-size: 0.85rem; padding: 10px 0; }

  .modal-actions {
    display: flex;
    flex-direction: column;
    gap: 8px;
    width: 100%;
    margin-top: 8px;
  }

  .modal-confirm {
    font-family: "Inter", sans-serif;
    font-weight: 600;
    font-size: 0.88rem;
    color: #fff;
    background: var(--pitch);
    border: none;
    border-radius: 10px;
    padding: 11px;
  }

  .modal-close {
    font-family: "Inter", sans-serif;
    font-size: 0.82rem;
    color: var(--ink-muted);
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px;
  }

  /* ---------- match entry modal ---------- */

  .match-modal-title {
    font-family: "Oswald", "Arial Narrow", sans-serif;
    font-weight: 700;
    font-size: 1.2rem;
    color: var(--ink);
  }

  .match-form {
    display: flex;
    flex-direction: column;
    gap: 14px;
    width: 100%;
  }

  .match-pair {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .match-team-select {
    flex: 1;
    min-width: 0;
    font-family: "Oswald", "Arial Narrow", sans-serif;
    font-size: 0.92rem;
    font-weight: 500;
    color: var(--ink);
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 8px 8px;
  }
  .match-team-select:focus { outline: none; border-color: var(--pitch); }

  .match-score-input {
    width: 48px;
    flex-shrink: 0;
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-weight: 700;
    font-size: 1rem;
    text-align: center;
    color: var(--ink);
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 8px 2px;
    font-variant-numeric: tabular-nums;
    -moz-appearance: textfield;
  }
  .match-score-input::-webkit-outer-spin-button,
  .match-score-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .match-score-input:focus { outline: none; border-color: var(--pitch); }

  .match-vs {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 0.05em;
    color: var(--ink-muted);
    flex-shrink: 0;
  }

  .match-error {
    font-size: 0.76rem;
    color: var(--relegation);
    text-align: center;
  }

  .match-predict {
    display: flex;
    flex-direction: column;
    gap: 7px;
    background: var(--surface-2);
    border-radius: 12px;
    padding: 10px 12px;
  }

  .predict-label {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 0.62rem;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    color: var(--ink-muted);
  }

  .predict-note {
    font-family: "Inter", sans-serif;
    font-size: 0.78rem;
    color: var(--ink-muted);
  }

  .predict-bar {
    position: relative;
    height: 8px;
    border-radius: 999px;
    background: var(--gold-soft);
    overflow: hidden;
  }

  .predict-fill {
    position: absolute;
    inset: 0 auto 0 0;
    background: var(--pitch);
    border-radius: 999px;
  }

  .predict-pcts {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 0.72rem;
    font-weight: 700;
    color: var(--ink);
  }

  @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
  @keyframes pop-in { from { opacity: 0; transform: scale(0.92) translateY(6px); } to { opacity: 1; transform: scale(1) translateY(0); } }

  @media (prefers-reduced-motion: reduce) {
    .modal-overlay, .modal-card { animation: none; }
  }

  /* ---------- column caption ---------- */

  .col-caption {
    display: grid;
    grid-template-columns: 5px 20px 26px 1fr 26px 44px 14px;
    gap: 6px;
    padding: 0 10px;
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 0.62rem;
    letter-spacing: 0.06em;
    color: var(--ink-muted);
    text-transform: uppercase;
  }
  .col-caption span:nth-child(1),
  .col-caption span:nth-child(3),
  .col-caption span:nth-child(7) { visibility: hidden; }
  .col-caption span:nth-child(5),
  .col-caption span:nth-child(6) { text-align: center; }

  /* ---------- table ---------- */

  .table {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .row {
    background: var(--surface);
    border-radius: 12px;
    box-shadow: var(--shadow);
    overflow: hidden;
  }

  .row-main {
    display: grid;
    grid-template-columns: 5px 20px 26px 1fr 26px 44px 14px;
    align-items: center;
    gap: 6px;
    padding: 10px 10px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }

  .stripe { align-self: stretch; border-radius: 3px; background: transparent; }
  .stripe.leader { background: var(--gold); }
  .stripe.europa { background: var(--europa); }
  .stripe.relegation { background: var(--relegation); }

  .rank {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-weight: 700;
    font-size: 0.8rem;
    color: var(--ink-muted);
    text-align: center;
    font-variant-numeric: tabular-nums;
  }
  .rank.leader { color: var(--gold); }

  .crest {
    width: 24px;
    height: 27px;
    clip-path: polygon(50% 0%, 100% 16%, 100% 62%, 50% 100%, 0% 62%, 0% 16%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Oswald", "Arial Narrow", sans-serif;
    font-weight: 700;
    font-size: 0.56rem;
    letter-spacing: 0.01em;
    color: #fff;
    text-shadow: 0 1px 1px rgba(0, 0, 0, 0.3);
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.2);
  }

  .team-cell {
    display: flex;
    align-items: center;
    gap: 5px;
    min-width: 0;
  }

  .team-name {
    font-family: "Oswald", "Arial Narrow", sans-serif;
    font-weight: 500;
    font-size: 0.98rem;
    letter-spacing: 0.01em;
    color: var(--ink);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    min-width: 0;
  }

  .streak-badge {
    flex-shrink: 0;
    font-family: "Inter", sans-serif;
    font-size: 0.64rem;
    font-weight: 700;
    color: var(--gold);
    background: var(--gold-soft);
    border-radius: 999px;
    padding: 2px 7px;
    white-space: nowrap;
  }

  .played {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 0.78rem;
    color: var(--ink-muted);
    text-align: center;
    font-variant-numeric: tabular-nums;
  }

  .pts-pill {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-weight: 700;
    font-size: 0.86rem;
    color: var(--pitch-deep);
    background: var(--pitch-soft);
    border-radius: 8px;
    padding: 3px 0;
    text-align: center;
    font-variant-numeric: tabular-nums;
  }
  .chevron {
    width: 16px;
    height: 16px;
    color: var(--ink-muted);
    transition: transform 0.18s ease;
    justify-self: center;
  }
  .row.open .chevron { transform: rotate(180deg); }

  /* ---------- detail / edit panel ---------- */

  .detail {
    display: grid;
    grid-template-rows: 0fr;
    transition: grid-template-rows 0.2s ease;
  }
  .row.open .detail { grid-template-rows: 1fr; }
  .detail-inner { overflow: hidden; }

  .detail-body {
    padding: 4px 12px 14px;
    border-top: 1px solid var(--line);
    margin: 0 10px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .name-field {
    display: flex;

  function uid() {
    return "t" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }

  function computed(team) {
    var p = team.w + team.d + team.l;
    var pts = team.w * 3 + team.d;
    var gd = team.gf - team.ga;
    return { p: p, pts: pts, gd: gd };
  }

  // 시즌이 바뀌어도 끊기지 않는 전체 기록(state.allMatches)에서 그 팀의
  // 통산 승/무/패·득실을 집계한다 — 연승 표시와 AI 예측이 여기 기반함.
  function allTimeStats(teamId) {
    var w = 0, d = 0, l = 0, gf = 0, ga = 0;
    (state.allMatches || []).forEach(function (m) {
      var isA = m.teamAId === teamId;
      var isB = m.teamBId === teamId;
      if (!isA && !isB) return;
      var mine = isA ? m.scoreA : m.scoreB;
      var theirs = isA ? m.scoreB : m.scoreA;

      ga += theirs;
      if (mine > theirs) w++;

    return { p: p, pts: w * 3 + d, gd: gf - ga };
  }

  // 전체 기록을 최신 순으로 훑어, 그 팀이 연속으로 이긴 경기 수를 센다 — 시즌이

  function winStreak(teamId) {

    for (var i = all.length - 1; i >= 0; i--) {

      var mine = isA ? m.scoreA : m.scoreB;

    var ca = allTimeStats(teamA.id);

  // Recomputes p/pts/gd for every team in an archived season record, re-sorts
  // by the same rules as the live table, and refreshes rank + champion —
  // called after editing any team's name or stats within season history.
  function recomputeHistoryRecord(entry) {
    entry.standings.forEach(function (row) {
      var c = computed(row);
      row.p = c.p;
      row.pts = c.pts;
      row.gd = c.gd;
    });
    entry.standings.sort(function (a, b) {
      if (b.pts !== a.pts) return b.pts - a.pts;
      if (b.gd !== a.gd) return b.gd - a.gd;
      if (b.gf !== a.gf) return b.gf - a.gf;
      return a.name.localeCompare(b.name, "ko");
    });
    entry.standings.forEach(function (row, i) { row.rank = i + 1; });
    entry.champion = entry.standings[0];
    entry.teamCount = entry.standings.length;
  }

  function wireEvents() {
    appEl.querySelectorAll('[data-role="toggle"]').forEach(function (el) {
      el.addEventListener("click", function () {
        var id = el.getAttribute("data-id");
        confirmDeleteId = null;
        openId = openId === id ? null : id;
        render();
      });
    });

    appEl.querySelectorAll('[data-role="name"]').forEach(function (el) {
      el.addEventListener("click", function (e) { e.stopPropagation(); });
      el.addEventListener("blur", function () {
        var id = el.getAttribute("data-id");
        var team = state.teams.find(function (t) { return t.id === id; });
        if (!team) return;
        var v = el.value.trim() || "이름 없음";
        if (v !== team.name) {
          team.name = v;
          exitExampleMode();
          persist();
          render();
        }
      });
    });

    appEl.querySelectorAll('[data-role="stat"]').forEach(function (el) {
      el.addEventListener("click", function (e) { e.stopPropagation(); });
      el.addEventListener("change", function () {
        var id = el.getAttribute("data-id");
        var field = el.getAttribute("data-field");
        var team = state.teams.find(function (t) { return t.id === id; });
        if (!team) return;
        var n = parseInt(el.value, 10);
        if (isNaN(n) || n < 0) n = 0;
        if (n > 999) n = 999;
        team[field] = n;
        exitExampleMode();
        persist();
        render();
      });
    });

    appEl.querySelectorAll('[data-role="color-swatch"]').forEach(function (el) {
      el.addEventListener("click", function (e) {
        e.stopPropagation();
        var id = el.getAttribute("data-id");
        var hueAttr = el.getAttribute("data-hue");
        var team = state.teams.find(function (t) { return t.id === id; });
        if (!team) return;
        team.color = hueAttr === "" ? null : Number(hueAttr);
        exitExampleMode();
        persist();
        render();
      });

    appEl.querySelectorAll('[data-role="delete"]').forEach(function (el) {
      el.addEventListener("click", function (e) {

    appEl.querySelectorAll('[data-role="delete-match"]').forEach(function (el) {
      el.addEventListener("click", function (e) {
        e.stopPropagation();
        confirmDeleteMatchId = el.getAttribute("data-id");
        render();
      });
    });

    appEl.querySelectorAll('[data-role="cancel-delete-match"]').forEach(function (el) {
      el.addEventListener("click", function () {
        confirmDeleteMatchId = null;
        render();
      });
    });

    appEl.querySelectorAll('[data-role="confirm-delete-match"]').forEach(function (el) {
      el.addEventListener("click", function () {
        var id = el.getAttribute("data-id");
        removeMatch(id);
      });
    });

    appEl.querySelectorAll('[data-role="tab-current"]').forEach(function (el) {
      el.addEventListener("click", function () {
        activeTab = "current";
        render();
      });
    });

    appEl.querySelectorAll('[data-role="tab-history"]').forEach(function (el) {
      el.addEventListener("click", function () {
        activeTab = "history";
        render();
      });
    });

    appEl.querySelectorAll('[data-role="history-toggle"]').forEach(function (el) {
      el.addEventListener("click", function () {
        var id = el.getAttribute("data-id");
        confirmDeleteHistoryId = null;
        openHistoryId = openHistoryId === id ? null : id;
        render();
      });
    });

    appEl.querySelectorAll('[data-role="h-name"]').forEach(function (el) {
      el.addEventListener("click", function (e) { e.stopPropagation(); });
      el.addEventListener("blur", function () {
        var seasonId = el.getAttribute("data-season");
        var teamIdx = parseInt(el.getAttribute("data-team"), 10);
        var entry = historyList.find(function (h) { return h.id === seasonId; });
        if (!entry || !entry.standings[teamIdx]) return;
        var v = el.value.trim() || "이름 없음";
        if (v !== entry.standings[teamIdx].name) {
          entry.standings[teamIdx].name = v;
          recomputeHistoryRecord(entry);
          persist();
          render();
        }
      });
    });

    appEl.querySelectorAll('[data-role="h-stat"]').forEach(function (el) {
      el.addEventListener("click", function (e) { e.stopPropagation(); });
      el.addEventListener("change", function () {
        var seasonId = el.getAttribute("data-season");
        var teamIdx = parseInt(el.getAttribute("data-team"), 10);
        var field = el.getAttribute("data-field");
        var entry = historyList.find(function (h) { return h.id === seasonId; });
        if (!entry || !entry.standings[teamIdx]) return;
        var n = parseInt(el.value, 10);
        if (isNaN(n) || n < 0) n = 0;
        if (n > 999) n = 999;
        entry.standings[teamIdx][field] = n;
        recomputeHistoryRecord(entry);
        persist();
        render();
      });
    });

    appEl.querySelectorAll('[data-role="delete-history"]').forEach(function (el) {
      el.addEventListener("click", function (e) {
        e.stopPropagation();
        confirmDeleteHistoryId = el.getAttribute("data-id");
        render();
      });
    });

    appEl.querySelectorAll('[data-role="cancel-delete-history"]').forEach(function (el) {
      el.addEventListener("click", function (e) {
        e.stopPropagation();
        confirmDeleteHistoryId = null;
        render();
      });
    });

    appEl.querySelectorAll('[data-role="confirm-delete-history"]').forEach(function (el) {
      el.addEventListener("click", function (e) {
        e.stopPropagation();
        var id = el.getAttribute("data-id");
        historyList = historyList.filter(function (h) { return h.id !== id; });
        confirmDeleteHistoryId = null;
        if (openHistoryId === id) openHistoryId = null;
        persist();
        render();
      });
    });

    document.body.style.overflow = (championModalOpen || matchModalOpen) ? "hidden" : "";
  }

  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && championModalOpen) {
      championModalOpen = false;
      render();
    } else if (e.key === "Escape" && matchModalOpen) {
      matchModalOpen = false;
      render();
    }
  });

  function exitExampleMode() {
    exampleMode = false;
  }

  function endSeason() {
    var ranked = sortedTeams();
    if (ranked.length === 0) return;

    var standings = ranked.map(function (entry, idx) {
      var t = entry.team;
      var c = entry.c;
      return { rank: idx + 1, name: t.name, w: t.w, d: t.d, l: t.l, gf: t.gf, ga: t.ga, p: c.p, pts: c.pts, gd: c.gd, color: (t.color != null ? t.color : null) };
    });
    var record = {
      leagueName: state.leagueName,
      endedAt: new Date().toISOString(),
      teamCount: standings.length,
      champion: standings[0],
      standings: standings
    };

    // 시즌 기록에 바로 반영 — historyList도 toDocBody()에 포함되므로 아래 persist()
    // 한 번으로 팀 리셋과 시즌 기록 추가가 함께 저장됨.
    var recordId = uid();
    var localRecord = Object.assign({ id: recordId }, record);
    historyList = [localRecord].concat(historyList.filter(function (r) { return r.id !== recordId; }));
    historyLoaded = true;

    state.teams = state.teams.map(function (t) {
      return { id: t.id, name: t.name, w: 0, d: 0, l: 0, gf: 0, ga: 0, color: (t.color != null ? t.color : null) };
    });
    state.matches = [];
    openId = null;
    confirmDeleteId = null;
    confirmDeleteMatchId = null;
    championModalOpen = false;
    activeTab = "history";
    persist();
    render();
  }

  // Applies one match's score to both teams' running w/d/l/gf/ga totals and
  // appends it to the current season's match log, so the standings are
  // always derived from entered results instead of hand-edited totals.
  function applyMatchResult() {
    var teamA = state.teams.find(function (t) { return t.id === matchTeamA; });
    var teamB = state.teams.find(function (t) { return t.id === matchTeamB; });
    if (!teamA || !teamB || teamA.id === teamB.id) return;

    var scoreA = parseInt(matchScoreA, 10);
    if (isNaN(scoreA) || scoreA < 0) scoreA = 0;
    if (scoreA > 99) scoreA = 99;
    var scoreB = parseInt(matchScoreB, 10);
    if (isNaN(scoreB) || scoreB < 0) scoreB = 0;
    if (scoreB > 99) scoreB = 99;

    teamA.gf += scoreA;
    teamA.ga += scoreB;
    teamB.gf += scoreB;
    teamB.ga += scoreA;
    if (scoreA > scoreB) {
      teamA.w += 1;
      teamB.l += 1;
    } else if (scoreA < scoreB) {
      teamB.w += 1;
      teamA.l += 1;
    } else {
      teamA.d += 1;
      teamB.d += 1;
    }

    var record = {
      id: uid(),
      teamAId: teamA.id,
      teamBId: teamB.id,
      scoreA: scoreA,
      scoreB: scoreB,
      playedAt: new Date().toISOString()
    };
    state.matches = (state.matches || []).concat([record]);
    state.allMatches = (state.allMatches || []).concat([record]);
    exitExampleMode();
    persist();
  }

  // Reverses one match's effect on both teams (if they still exist) and
  // removes it from the log — used when a mis-entered result is deleted.
  function removeMatch(id) {
    var matches = state.matches || [];
    var m = matches.find(function (x) { return x.id === id; });
    if (!m) {
      confirmDeleteMatchId = null;
      render();
      return;
    }

    var teamA = state.teams.find(function (t) { return t.id === m.teamAId; });
    var teamB = state.teams.find(function (t) { return t.id === m.teamBId; });
    if (teamA) {
      teamA.gf -= m.scoreA;
      teamA.ga -= m.scoreB;
      if (m.scoreA > m.scoreB) teamA.w -= 1;
      else if (m.scoreA < m.scoreB) teamA.l -= 1;
      else teamA.d -= 1;
      ["w", "d", "l", "gf", "ga"].forEach(function (f) { if (teamA[f] < 0) teamA[f] = 0; });
    }
    if (teamB) {
      teamB.gf -= m.scoreB;
      teamB.ga -= m.scoreA;
      if (m.scoreB > m.scoreA) teamB.w -= 1;
      else if (m.scoreB < m.scoreA) teamB.l -= 1;
      else teamB.d -= 1;
      ["w", "d", "l", "gf", "ga"].forEach(function (f) { if (teamB[f] < 0) teamB[f] = 0; });
    }

    state.matches = matches.filter(function (x) { return x.id !== id; });
    // 잘못 입력해 되돌리는 경기이므로, 통산 기록(연승/AI 예측용)에서도 함께 제외
    state.allMatches = (state.allMatches || []).filter(function (x) { return x.id !== id; });
    confirmDeleteMatchId = null;
    persist();
    render();
  }

  function addTeam() {
    if (exampleMode) {
      exampleMode = false;
      state.teams = [];
    }
    var t = { id: uid(), name: "새 팀", w: 0, d: 0, l: 0, gf: 0, ga: 0, color: null };
    state.teams.push(t);
    openId = t.id;
    persist();
    render();
    var el = appEl.querySelector('[data-role="name"][data-id="' + t.id + '"]');
    if (el) { el.focus(); el.select(); }
  }

  addBtn.addEventListener("click", addTeam);

  /* ---------- persistence (Supabase) ---------- */

  var writing = false;
  var pendingWrite = false;
  var realtimeChannel = null;

  // Everything the app needs — teams, 경기 기록, 시즌 기록 — is stored as one
  // JSON blob in a single row (id = ROW_ID) of the app_state table, so every
  // edit is a single upsert instead of juggling several tables.
  function toDocBody() {
    return {
      leagueName: state.leagueName,
      teams: state.teams,
      matches: state.matches,
      allMatches: state.allMatches,
      exampleMode: exampleMode,
      seasons: historyList
    };
  }

  function normalizeMatch(m) {
    return {
      id: String(m.id || uid()),
      teamAId: String(m.teamAId || ""),
      teamBId: String(m.teamBId || ""),
      scoreA: Number(m.scoreA) || 0,
      scoreB: Number(m.scoreB) || 0,
      playedAt: String(m.playedAt || "")
    };
  }

  function persist() {
    if (!supabaseClient) return;
    scheduleWrite();
  }

  function scheduleWrite() {
    if (writing) { pendingWrite = true; return; }
    writing = true;
    var body = toDocBody();
    Promise.resolve(
      supabaseClient.from("app_state").upsert({ id: ROW_ID, data: body, updated_at: new Date().toISOString() })
    ).then(function (res) {
      if (res && res.error) throw res.error;
    }).catch(function () {
      /* last-writer-wins elsewhere, or transiently unavailable; next edit retries */
    }).then(function () {
      writing = false;
      if (pendingWrite) {
        pendingWrite = false;
        scheduleWrite();
      }
    });
  }

  function applyRemote(data) {
    if (!data) return;
    if (typeof data.leagueName === "string") state.leagueName = data.leagueName;
    if (Array.isArray(data.teams)) {
      state.teams = data.teams.map(function (t) {
        return {
          id: String(t.id || uid()),
          name: String(t.name || "이름 없음"),
          w: Number(t.w) || 0,
          d: Number(t.d) || 0,
          l: Number(t.l) || 0,
          gf: Number(t.gf) || 0,
          ga: Number(t.ga) || 0,
          color: (t.color === null || t.color === undefined || isNaN(Number(t.color))) ? null : Number(t.color)
        };
      });
    }
    if (Array.isArray(data.matches)) {
      state.matches = data.matches.map(normalizeMatch);
    }
    if (Array.isArray(data.allMatches)) {
      state.allMatches = data.allMatches.map(normalizeMatch);
    } else if (Array.isArray(data.matches)) {
      // 이전 버전 데이터(통산 기록 필드가 없던 시절)에서 넘어온 경우: 최소한
      // 지금 보이는 이번 시즌 경기라도 통산 기록의 시작점으로 삼는다.
      state.allMatches = state.matches.slice();
    }
    if (typeof data.exampleMode === "boolean") exampleMode = data.exampleMode;
    if (Array.isArray(data.seasons)) {
      historyList = data.seasons.map(function (s) {
        return {
          id: String(s.id || uid()),
          leagueName: String(s.leagueName || state.leagueName || ""),
          endedAt: String(s.endedAt || ""),
          teamCount: Number(s.teamCount) || (Array.isArray(s.standings) ? s.standings.length : 0),
          champion: s.champion || null,
          standings: Array.isArray(s.standings) ? s.standings : []
        };
      });
      historyList.sort(function (a, b) { return (b.endedAt || "").localeCompare(a.endedAt || ""); });
    }
  }

  render();

  // Safety net: whatever else happens, never leave "불러오는 중" stuck forever.
  setTimeout(function () {
    var changed = false;
    if (!historyLoaded) { historyLoaded = true; changed = true; }
    if (changed) render();
  }, 8000);

  (async function init() {
    if (!supabaseClient) {
      // SUPABASE_KEY가 비어있거나 CDN을 못 불러온 경우: 로컬 전용으로 동작
      historyLoaded = true;
      render();
      return;
    }

    try {
      var res = await supabaseClient.from("app_state").select("data").eq("id", ROW_ID).maybeSingle();
      if (res.error) throw res.error;
      if (res.data && res.data.data) {
        applyRemote(res.data.data);
      } else {
        // 이 프로젝트에서 처음 실행되는 경우: 지금 상태(빈 팀 1개)로 행을 만들어둠
        await Promise.resolve(
          supabaseClient.from("app_state").upsert({ id: ROW_ID, data: toDocBody(), updated_at: new Date().toISOString() })
        ).catch(function () {});
      }
    } catch (e) {
      /* 최초 로드 실패: 로컬 기본 상태를 유지하고, 다음 편집 때 다시 저장을 시도함 */
    }
    historyLoaded = true;
    render();

    // 실시간 동기화: 다른 기기/브라우저에서 저장한 내용이 이 화면에도 바로 반영됨
    try {
      realtimeChannel = supabaseClient
        .channel("app_state_sync")
        .on(
          "postgres_changes",
          { event: "*", schema: "public", table: "app_state", filter: "id=eq." + ROW_ID },
          function (payload) {
            var row = payload && payload.new;
            if (!row || !row.data) return;
            applyRemote(row.data);
            // 내 write도 이 채널로 그대로 되돌아오므로, 그 팀이 실제로 사라졌을
            // 때만(다른 기기에서 삭제됐을 때만) 열려있던 패널을 닫음 — 매번
            // 무조건 닫으면 편집 직후 패널이 바로 닫혀버림.
            if (openId && !state.teams.some(function (t) { return t.id === openId; })) {
              openId = null;
            }
            if (confirmDeleteId && !state.teams.some(function (t) { return t.id === confirmDeleteId; })) {
              confirmDeleteId = null;
            }
            render();
          }
        )
        .subscribe();
    } catch (e) {
      /* 실시간 채널 연결 실패: 이 탭은 계속 동작하되, 다른 기기의 변경사항만 실시간으로 못 받음 */
    }
  })();
})();
</script>
</body>
</html>
