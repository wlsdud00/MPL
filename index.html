<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MNM Gaming</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
  /* ==========================================================
     MNM Gaming — Dark Gaming Dashboard 팔레트
     이 앱은 항상 "다크 게이밍" 테마 하나로 고정한다(OS가 라이트 모드여도
     동일). data-theme="dark"/prefers-color-scheme는 예전 라이트/다크 토글용
     구조가 남아있는 것뿐이라 굳이 지우지 않고 세 블록 모두 같은 값으로
     맞춰서, 나중에 누군가 그 토글을 다시 켜더라도 결과가 달라지지 않게 했다.
     ========================================================== */
  :root {
    --paper: #05070a;
    --surface: #11161f;
    --surface-2: #181f2a;
    --ink: #f1f4f9;
    --ink-muted: #8b95a8;
    --pitch: #39ff8a;
    --pitch-deep: #2be07a;
    --pitch-soft: #0f2e1f;
    --gold: #ffb224;
    --gold-soft: #3a2a10;
    --line: rgba(255, 255, 255, 0.08);
    --relegation: #ff5d72;
    --relegation-soft: #34141c;
    --europa: #4fc3ff;
    --europa-soft: #102636;
    --field-tint: rgba(57, 255, 138, 0.05);
    --floodlight: rgba(57, 255, 138, 0.16);
    --pitch-line: rgba(57, 255, 138, 0.22);
    --shadow: 0 0 0 1px var(--line), 0 10px 26px -14px rgba(0, 0, 0, 0.75);
    --on-accent: #04150c;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #05070a;
      --surface: #11161f;
      --surface-2: #181f2a;
      --ink: #f1f4f9;
      --ink-muted: #8b95a8;
      --pitch: #39ff8a;
      --pitch-deep: #2be07a;
      --pitch-soft: #0f2e1f;
      --gold: #ffb224;
      --gold-soft: #3a2a10;
      --line: rgba(255, 255, 255, 0.08);
      --relegation: #ff5d72;
      --relegation-soft: #34141c;
      --europa: #4fc3ff;
      --europa-soft: #102636;
      --field-tint: rgba(57, 255, 138, 0.05);
      --floodlight: rgba(57, 255, 138, 0.16);
      --pitch-line: rgba(57, 255, 138, 0.22);
      --shadow: 0 0 0 1px var(--line), 0 10px 26px -14px rgba(0, 0, 0, 0.75);
      --on-accent: #04150c;
    }
  }

  :root[data-theme="dark"] {
    --paper: #05070a;
    --surface: #11161f;
    --surface-2: #181f2a;
    --ink: #f1f4f9;
    --ink-muted: #8b95a8;
    --pitch: #39ff8a;
    --pitch-deep: #2be07a;
    --pitch-soft: #0f2e1f;
    --gold: #ffb224;
    --gold-soft: #3a2a10;
    --line: rgba(255, 255, 255, 0.08);
    --relegation: #ff5d72;
    --relegation-soft: #34141c;
    --europa: #4fc3ff;
    --europa-soft: #102636;
    --field-tint: rgba(57, 255, 138, 0.05);
    --floodlight: rgba(57, 255, 138, 0.16);
    --pitch-line: rgba(57, 255, 138, 0.22);
    --shadow: 0 0 0 1px var(--line), 0 10px 26px -14px rgba(0, 0, 0, 0.75);
    --on-accent: #04150c;
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    background-color: var(--paper);
    background-image:
      radial-gradient(420px 280px at 6% -8%, var(--floodlight), transparent 62%),
      radial-gradient(420px 280px at 94% -6%, rgba(255, 178, 36, 0.1), transparent 62%),
      radial-gradient(circle at 50% 34%, transparent 0 84px, var(--pitch-line) 84px 86px, transparent 86px 100%),
      linear-gradient(var(--pitch-line), var(--pitch-line)),
      repeating-linear-gradient(135deg, var(--field-tint) 0 26px, transparent 26px 52px);
    background-repeat: no-repeat, no-repeat, no-repeat, no-repeat, repeat;
    background-position: 0 0, 0 0, 0 0, center 34%, 0 0;
    background-size: auto, auto, auto, 100% 2px, auto;
    background-attachment: fixed, fixed, fixed, fixed, scroll;
    color: var(--ink);
    font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
    padding-inline: 16px;
    padding-block: 14px calc(128px + env(safe-area-inset-bottom, 0px));
    display: flex;
    justify-content: center;
  }

  .app {
    width: 100%;
    max-width: 440px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  /* ---------- header ---------- */

  .header {
    position: sticky;
    top: env(safe-area-inset-top, 0px);
    z-index: 5;
    background: var(--paper);
    padding-block: 6px 4px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .pitch-banner {
    position: relative;
    min-height: 118px;
    border-radius: 18px;
    overflow: hidden;
    background:
      radial-gradient(120% 160% at 12% -20%, rgba(57, 255, 138, 0.22), transparent 58%),
      linear-gradient(155deg, #141b26, #0b0f16 70%);
    box-shadow: var(--shadow);
  }
  /* 모드별 히어로 글로우 — Football/순서 정하기는 네온 그린, PUBG는 옐로/오렌지 */
  .pitch-banner--random.pitch-banner--photo {
    background: linear-gradient(155deg, #141b26, #0b0f16 70%);
  }
  /* Football 히어로 배너 — 첨부 이미지를 자르지 않고 원본 비율 그대로 보여준다 */
  .pitch-banner--photo {
    padding: 0;
    min-height: 0;
    background: linear-gradient(155deg, #141b26, #0b0f16 70%);
  }
  .pitch-banner-photo {
    display: block;
    width: 100%;
    height: auto;
  }
  .pitch-banner--pubg.pitch-banner--photo {
    background: linear-gradient(155deg, #221a12, #0f0b08 70%);
  }
  .pitch-banner--pubg .field-strip {
    background: repeating-linear-gradient(115deg, var(--gold) 0 14px, #b5780f 14px 28px);
  }

  .banner-content {
    position: relative;
    z-index: 1;
    padding: 16px 18px 14px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 3px;
  }

  .banner-eyebrow {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 0.62rem;
    font-weight: 600;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: var(--pitch);
  }

  .hero-tagline {
    font-family: "Inter", sans-serif;
    font-size: 0.68rem;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-muted);
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 6px;
  }
  .hero-tagline span {
    font-family: "Inter", sans-serif;
    font-size: 0.74rem;
    font-weight: 500;
    letter-spacing: 0;
    text-transform: none;
    color: var(--ink-muted);
    opacity: 0.85;
  }

  .league-logo {
    display: block;
    height: 54px;
    width: auto;
    max-width: 78%;
    object-fit: contain;
    object-position: left center;
    filter: drop-shadow(0 1px 3px rgba(0, 0, 0, 0.12));
  }

  /* ---------- grass strip ---------- */

  .field-strip {
    position: relative;
    height: 16px;
    flex-shrink: 0;
    border-radius: 8px;
    overflow: hidden;
    background: repeating-linear-gradient(115deg, var(--pitch) 0 14px, var(--pitch-deep) 14px 28px);
    box-shadow: var(--shadow);
  }

  .field-strip-lines {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }

  .eyebrow {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 0.68rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-muted);
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    row-gap: 6px;
    column-gap: 6px;
  }

  .example-badge {
    font-family: "Inter", sans-serif;
    font-size: 0.66rem;
    letter-spacing: 0.02em;
    text-transform: none;
    color: var(--gold);
    background: var(--gold-soft);
    border-radius: 999px;
    padding: 2px 8px;
    white-space: nowrap;
  }

  /* ---------- primary action row (match entry / end season) ---------- */

  .action-row {
    display: flex;
    gap: 8px;
  }

  .action-row button {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    min-height: 46px;
    font-family: "Inter", sans-serif;
    font-size: 0.84rem;
    font-weight: 700;
    letter-spacing: 0.01em;
    text-transform: none;
    border: none;
    border-radius: 13px;
    padding: 0 14px;
    white-space: nowrap;
  }

  .end-btn {
    color: var(--on-accent);
    background: var(--gold);
    box-shadow: 0 6px 18px -6px rgba(255, 178, 36, 0.55);
  }
  .end-btn svg { width: 17px; height: 17px; }

  .match-btn {
    color: var(--on-accent);
    background: var(--pitch);
    box-shadow: 0 6px 18px -6px rgba(57, 255, 138, 0.5);
  }
  .match-btn svg { width: 17px; height: 17px; }

  /* ---------- tab bar ---------- */

  .tabbar {
    display: flex;
    gap: 4px;
    background: var(--surface-2);
    border-radius: 12px;
    padding: 4px;
  }

  .tab-btn {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    font-family: "Inter", sans-serif;
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--ink-muted);
    background: transparent;
    border: none;
    border-radius: 9px;
    padding: 9px 0;
    white-space: nowrap;
  }
  .tab-btn.active {
    background: var(--surface);
    color: var(--ink);
    box-shadow: var(--shadow);
  }
  .tab-count {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 0.68rem;
    color: inherit;
    opacity: 0.7;
  }

  /* ---------- season history ---------- */

  .history-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .load-more-btn {
    width: 100%;
    margin-top: 10px;
    font-family: "Inter", sans-serif;
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--ink-muted);
    background: var(--surface);
    border: 1px dashed var(--line);
    border-radius: 12px;
    padding: 12px 14px;
    box-shadow: var(--shadow);
  }

  .history-entry {
    display: flex;
    flex-direction: column;
    gap: 10px;
    background: linear-gradient(135deg, var(--gold-soft), var(--surface) 55%);
    border: 1px solid var(--gold);
    border-radius: 14px;
    padding: 12px 14px 14px;
    box-shadow: var(--shadow);
  }

  .history-top {
    display: flex;
    align-items: center;
    gap: 12px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }

  .history-top .crest-lg { flex-shrink: 0; }

  .history-chevron {
    width: 16px;
    height: 16px;
    color: var(--ink-muted);
    flex-shrink: 0;
    margin-left: auto;
    transition: transform 0.18s ease;
  }
  .history-entry.open .history-chevron { transform: rotate(180deg); }

  .champion-info { display: flex; flex-direction: column; gap: 2px; min-width: 0; }

  .champion-eyebrow {
    display: flex;
    align-items: center;
    gap: 5px;
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 0.64rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--gold);
  }
  .champion-eyebrow svg { width: 13px; height: 13px; flex-shrink: 0; }

  .champion-name {
    font-family: "Oswald", "Arial Narrow", sans-serif;
    font-weight: 600;
    font-size: 1.1rem;
    color: var(--ink);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .champion-record {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 0.7rem;
    color: var(--ink-muted);
  }

  /* ---------- season history: edit / delete detail ---------- */

  .history-detail {
    display: grid;
    grid-template-rows: 0fr;
    transition: grid-template-rows 0.2s ease;
  }
  .history-entry.open .history-detail { grid-template-rows: 1fr; }
  .history-detail-inner { overflow: hidden; }

  .history-body {
    padding-top: 10px;
    margin-top: 2px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .h-team-block {
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding-top: 10px;
    border-top: 1px solid var(--line);
  }
  .h-team-block:first-child { padding-top: 0; border-top: none; }

  .h-team-head {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .h-rank-badge {
    width: 16px;
    flex-shrink: 0;
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 0.7rem;
    font-weight: 700;
    color: var(--ink-muted);
    text-align: center;
    font-variant-numeric: tabular-nums;
  }

  .crest-lg {
    width: 56px;
    height: 62px;
    clip-path: polygon(50% 0%, 100% 16%, 100% 62%, 50% 100%, 0% 62%, 0% 16%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Oswald", "Arial Narrow", sans-serif;
    font-weight: 700;
    font-size: 1.2rem;
    color: #fff;
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
    box-shadow: inset 0 0 0 1.5px rgba(255, 255, 255, 0.25), 0 4px 10px -4px rgba(0, 0, 0, 0.35);
  }

  /* ---------- all-time records ---------- */

  .records-panel {
    display: flex;
    flex-direction: column;
    gap: 12px;
    background: var(--surface);
    border-radius: 14px;
    padding: 14px;
    box-shadow: var(--shadow);
    margin-bottom: 10px;
  }

  .records-title {
    display: flex;
    align-items: center;
    gap: 6px;
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 0.66rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink-muted);
  }
  .records-title svg { width: 14px; height: 14px; color: var(--gold); flex-shrink: 0; }

  .records-champs {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .champ-chip {
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--gold-soft);
    border-radius: 999px;
    padding: 5px 10px 5px 6px;
  }
  .champ-chip-name {
    font-family: "Oswald", "Arial Narrow", sans-serif;
    font-weight: 500;
    font-size: 0.8rem;
    color: var(--ink);
    white-space: nowrap;
    max-width: 40vw;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .champ-chip-count {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-weight: 700;
    font-size: 0.68rem;
    color: var(--gold);
    white-space: nowrap;
  }

  .records-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
  }

  .record-card {
    background: var(--surface-2);
    border-radius: 10px;
    padding: 10px 12px;
    display: flex;
    flex-direction: column;
    gap: 3px;
    min-width: 0;
  }

  .record-label {
    font-size: 0.66rem;
    color: var(--ink-muted);
  }

  .record-value {
    font-family: "Oswald", "Arial Narrow", sans-serif;
    font-weight: 600;
    font-size: 1.05rem;
    color: var(--pitch-deep);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .record-value { color: var(--pitch); }
  }
  :root[data-theme="dark"] .record-value { color: var(--pitch); }

  .record-detail {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 0.66rem;
    color: var(--ink-muted);
    line-height: 1.4;
    word-break: break-word;
  }

  /* ---------- champion modal ---------- */

  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(2, 4, 6, 0.75);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 50;
    animation: fade-in 0.15s ease;
  }

  .modal-card {
    position: relative;
    width: 100%;
    max-width: 340px;
    background: var(--surface);
    border-radius: 20px;
    padding: 28px 22px 22px;
    box-shadow: 0 24px 48px -16px rgba(0, 0, 0, 0.45);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    text-align: center;
    overflow: hidden;
    animation: pop-in 0.22s cubic-bezier(0.2, 0.9, 0.3, 1.2);
  }

  .modal-field {
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(90deg, var(--pitch-soft) 0 18px, transparent 18px 36px);
    opacity: 0.5;
    z-index: 0;
  }

  .confetti-dot {
    position: absolute;
    border-radius: 50%;
    opacity: 0.8;
  }

  .modal-inner { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; gap: 10px; width: 100%; }

  .modal-trophy { width: 46px; height: 46px; color: var(--gold); }
  .modal-match-icon { width: 40px; height: 40px; color: var(--pitch); }

  .modal-eyebrow {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 0.68rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--gold);
  }

  .modal-crest { margin: 2px 0; }

  .modal-name {
    font-family: "Oswald", "Arial Narrow", sans-serif;
    font-weight: 700;
    font-size: 1.5rem;
    letter-spacing: 0.01em;
    color: var(--ink);
    text-wrap: balance;
  }

  .modal-record {
    display: flex;
    gap: 12px;
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 0.76rem;
    color: var(--ink-muted);
  }
  .modal-record b { color: var(--ink); font-weight: 700; }

  .modal-empty { color: var(--ink-muted); font-size: 0.85rem; padding: 10px 0; }

  .modal-actions {
    display: flex;
    flex-direction: column;
    gap: 8px;
    width: 100%;
    margin-top: 8px;
  }

  .modal-confirm {
    font-family: "Inter", sans-serif;
    font-weight: 600;
    font-size: 0.88rem;
    color: var(--on-accent);
    background: var(--pitch);
    border: none;
    border-radius: 10px;
    box-shadow: 0 6px 18px -6px rgba(57, 255, 138, 0.5);
    padding: 11px;
  }

  .modal-close {
    font-family: "Inter", sans-serif;
    font-size: 0.82rem;
    color: var(--ink-muted);
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px;
  }

  /* ---------- match entry modal ---------- */

  .match-modal-title {
    font-family: "Oswald", "Arial Narrow", sans-serif;
    font-weight: 700;
    font-size: 1.2rem;
    color: var(--ink);
  }

  .match-form {
    display: flex;
    flex-direction: column;
    gap: 14px;
    width: 100%;
  }

  .match-type-select {
    display: flex;
    gap: 4px;
    background: var(--surface-2);
    border-radius: 12px;
    padding: 4px;
  }
  .match-type-btn {
    flex: 1;
    font-family: "Inter", sans-serif;
    font-size: 0.84rem;
    font-weight: 700;
    color: var(--ink-muted);
    background: transparent;
    border: none;
    border-radius: 9px;
    padding: 9px 0;
  }
  .match-type-btn.active {
    background: var(--surface);
    color: var(--ink);
    box-shadow: var(--shadow);
  }

  .match-type-hint {
    margin-top: -8px;
    font-size: 0.72rem;
    color: var(--ink-muted);
    text-align: center;
  }

  .match-pair {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .match-team-select {
    flex: 1;
    min-width: 0;
    font-family: "Oswald", "Arial Narrow", sans-serif;
    font-size: 0.92rem;
    font-weight: 500;
    color: var(--ink);
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 8px 8px;
  }
  .match-team-select:focus { outline: none; border-color: var(--pitch); }

  .match-score-input {
    width: 48px;
    flex-shrink: 0;
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-weight: 700;
    font-size: 1rem;
    text-align: center;
    color: var(--ink);
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 8px 2px;
    font-variant-numeric: tabular-nums;
    -moz-appearance: textfield;
  }
  .match-score-input::-webkit-outer-spin-button,
  .match-score-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .match-score-input:focus { outline: none; border-color: var(--pitch); }

  .match-vs {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 0.05em;
    color: var(--ink-muted);
    flex-shrink: 0;
  }

  .match-error {
    font-size: 0.76rem;
    color: var(--relegation);
    text-align: center;
  }

  .match-predict {
    display: flex;
    flex-direction: column;
    gap: 7px;
    background: var(--surface-2);
    border-radius: 12px;
    padding: 10px 12px;
  }

  .predict-label {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 0.62rem;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    color: var(--ink-muted);
  }

  .predict-note {
    font-family: "Inter", sans-serif;
    font-size: 0.78rem;
    color: var(--ink-muted);
  }

  .predict-bar {
    position: relative;
    height: 8px;
    border-radius: 999px;
    background: var(--gold-soft);
    overflow: hidden;
  }

  .predict-fill {
    position: absolute;
    inset: 0 auto 0 0;
    background: var(--pitch);
    border-radius: 999px;
  }

  .predict-pcts {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 0.72rem;
    font-weight: 700;
    color: var(--ink);
  }

  @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
  @keyframes pop-in { from { opacity: 0; transform: scale(0.92) translateY(6px); } to { opacity: 1; transform: scale(1) translateY(0); } }

  @media (prefers-reduced-motion: reduce) {
    .modal-overlay, .modal-card { animation: none; }
  }

  /* ---------- column caption ---------- */

  .col-caption {
    display: grid;
    grid-template-columns: 5px 20px 26px 1fr 26px 44px 14px;
    gap: 6px;
    padding: 0 10px;
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 0.62rem;
    letter-spacing: 0.06em;
    color: var(--ink-muted);
    text-transform: uppercase;
  }
  .col-caption span:nth-child(1),
  .col-caption span:nth-child(3),
  .col-caption span:nth-child(7) { visibility: hidden; }
  .col-caption span:nth-child(5),
  .col-caption span:nth-child(6) { text-align: center; }

  /* ---------- table ---------- */

  .table {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .row {
    background: var(--surface);
    border-radius: 12px;
    box-shadow: var(--shadow);
    overflow: hidden;
  }

  .row-main {
    display: grid;
    grid-template-columns: 5px 20px 26px 1fr 26px 44px 14px;
    align-items: center;
    gap: 6px;
    padding: 10px 10px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }

  .stripe { align-self: stretch; border-radius: 3px; background: transparent; }
  .stripe.leader { background: var(--gold); }
  .stripe.europa { background: var(--europa); }
  .stripe.relegation { background: var(--relegation); }

  .rank {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-weight: 700;
    font-size: 0.8rem;
    color: var(--ink-muted);
    text-align: center;
    font-variant-numeric: tabular-nums;
  }
  .rank.leader { color: var(--gold); }

  .crest {
    width: 24px;
    height: 27px;
    clip-path: polygon(50% 0%, 100% 16%, 100% 62%, 50% 100%, 0% 62%, 0% 16%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Oswald", "Arial Narrow", sans-serif;
    font-weight: 700;
    font-size: 0.56rem;
    letter-spacing: 0.01em;
    color: #fff;
    text-shadow: 0 1px 1px rgba(0, 0, 0, 0.3);
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.2);
  }

  .team-cell {
    display: flex;
    flex-direction: column;
    gap: 2px;
    min-width: 0;
  }

  .team-name-line {
    display: flex;
    align-items: center;
    gap: 5px;
    min-width: 0;
  }

  .rating-line {
    display: flex;
    align-items: center;
    gap: 4px;
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 0.66rem;
    color: var(--ink-muted);
    letter-spacing: 0.02em;
  }
  .rating-line .rating-value { font-weight: 700; color: var(--ink); }

  .team-name {
    font-family: "Oswald", "Arial Narrow", sans-serif;
    font-weight: 500;
    font-size: 0.98rem;
    letter-spacing: 0.01em;
    color: var(--ink);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    min-width: 0;
  }

  .streak-badge {
    flex-shrink: 0;
    font-family: "Inter", sans-serif;
    font-size: 0.64rem;
    font-weight: 700;
    color: var(--gold);
    background: var(--gold-soft);
    border-radius: 999px;
    padding: 2px 7px;
    white-space: nowrap;
  }

  .played {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 0.78rem;
    color: var(--ink-muted);
    text-align: center;
    font-variant-numeric: tabular-nums;
  }

  .pts-pill {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-weight: 700;
    font-size: 0.86rem;
    color: var(--pitch-deep);
    background: var(--pitch-soft);
    border-radius: 8px;
    padding: 3px 0;
    text-align: center;
    font-variant-numeric: tabular-nums;
  }
  .chevron {
    width: 16px;
    height: 16px;
    color: var(--ink-muted);
    transition: transform 0.18s ease;
    justify-self: center;
  }
  .row.open .chevron { transform: rotate(180deg); }

  /* ---------- detail / edit panel ---------- */

  .detail {
    display: grid;
    grid-template-rows: 0fr;
    transition: grid-template-rows 0.2s ease;
  }
  .row.open .detail { grid-template-rows: 1fr; }
  .detail-inner { overflow: hidden; }

  .detail-body {
    padding: 4px 12px 14px;
    border-top: 1px solid var(--line);
    margin: 0 10px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .name-field {
    display: flex;
    flex-direction: column;
    gap: 4px;
    margin-top: 10px;
  }

  .field-label {
    font-size: 0.68rem;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--ink-muted);
  }

  .name-input {
    font-family: "Oswald", "Arial Narrow", sans-serif;
    font-size: 1rem;
    font-weight: 500;
    color: var(--ink);
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 7px 10px;
  }
  .name-input:focus { outline: none; border-color: var(--pitch); }

  .color-field {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .color-swatches {
    display: flex;
    flex-wrap: wrap;
    gap: 9px;
  }

  .color-swatch {
    width: 26px;
    height: 26px;
    flex-shrink: 0;
    border-radius: 50%;
    border: none;
    padding: 0;
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.22);
  }
  .color-swatch.selected {
    box-shadow: 0 0 0 2px var(--surface-2), 0 0 0 4px var(--ink);
  }
  .color-swatch.auto {
    background: var(--surface-2);
    color: var(--ink-muted);
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1px dashed var(--line);
    box-shadow: none;
  }
  .color-swatch.auto svg { width: 13px; height: 13px; }
  .color-swatch.auto.selected {
    box-shadow: 0 0 0 2px var(--surface-2), 0 0 0 4px var(--ink);
    border-color: transparent;
  }

  .stat-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
  }

  .stat-field { display: flex; flex-direction: column; gap: 4px; align-items: center; }

  .stat-input {
    width: 100%;
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-weight: 600;
    font-size: 0.9rem;
    text-align: center;
    color: var(--ink);
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 7px 2px;
    font-variant-numeric: tabular-nums;
    -moz-appearance: textfield;
  }
  .stat-input::-webkit-outer-spin-button,
  .stat-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .stat-input:focus { outline: none; border-color: var(--pitch); }

  .derived-row {
    display: flex;
    gap: 10px;
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 0.76rem;
    color: var(--ink-muted);
  }
  .derived-row b { color: var(--ink); font-weight: 700; }

  .row-actions {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 2px;
  }

  .delete-btn {
    font-family: "Inter", sans-serif;
    font-size: 0.78rem;
    color: var(--relegation);
    background: var(--relegation-soft);
    border: none;
    border-radius: 8px;
    padding: 7px 12px;
  }

  .confirm-row {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.78rem;
    color: var(--ink-muted);
  }
  .confirm-yes {
    font-family: "Inter", sans-serif;
    font-size: 0.78rem;
    font-weight: 600;
    color: #fff;
    background: var(--relegation);
    border: none;
    border-radius: 8px;
    padding: 7px 12px;
  }
  .confirm-no {
    font-family: "Inter", sans-serif;
    font-size: 0.78rem;
    color: var(--ink-muted);
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 6px 11px;
  }

  /* ---------- legend ---------- */

  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 10px 16px;
    padding: 2px 10px 0;
    font-size: 0.68rem;
    color: var(--ink-muted);
  }
  .legend-item { display: flex; align-items: center; gap: 5px; }
  .legend-icon { width: 13px; height: 13px; flex-shrink: 0; }

  /* ---------- 전체 전적 탭 ---------- */

  .overall-caption {
    display: grid;
    grid-template-columns: 26px 1fr 30px 26px 26px 26px 40px 56px;
    gap: 5px;
    padding: 0 10px;
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 0.6rem;
    letter-spacing: 0.05em;
    color: var(--ink-muted);
    text-transform: uppercase;
    text-align: center;
  }
  .overall-caption span:first-child { visibility: hidden; }
  .overall-caption span:nth-child(2) { text-align: left; }

  .overall-table {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-top: 6px;
  }

  .overall-row {
    display: grid;
    grid-template-columns: 26px 1fr 30px 26px 26px 26px 40px 56px;
    align-items: center;
    gap: 5px;
    background: var(--surface);
    border-radius: 12px;
    box-shadow: var(--shadow);
    padding: 10px 8px;
  }
  .overall-row .team-name { font-size: 0.88rem; }
  .overall-row .played { font-size: 0.74rem; }
  .overall-row .pts-pill { font-size: 0.76rem; padding: 3px 1px; }

  .overall-rating {
    display: flex;
    flex-direction: column;
    align-items: center;
    line-height: 1.2;
  }
  .overall-rating .rating-value {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-weight: 700;
    font-size: 0.8rem;
    color: var(--ink);
    font-variant-numeric: tabular-nums;
  }
  .overall-rating .rating-delta {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 0.62rem;
    color: var(--ink-muted);
  }

  .overall-hint {
    padding: 10px 10px 0;
    font-size: 0.72rem;
    color: var(--ink-muted);
    text-align: center;
  }

  /* ---------- 레이팅 표시 공통(팀 행 · 전체 전적 · 경기 기록) ---------- */

  .rating-delta.up { color: var(--pitch-deep); font-weight: 700; }
  .rating-delta.down { color: var(--relegation); font-weight: 700; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .rating-delta.up { color: var(--pitch); }
  }
  :root[data-theme="dark"] .rating-delta.up { color: var(--pitch); }

  /* ---------- match log ---------- */

  .match-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .match-list-title {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 0 10px;
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 0.62rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--ink-muted);
  }

  .match-row-wrap {
    display: flex;
    flex-direction: column;
    gap: 3px;
  }

  .match-row {
    display: grid;
    grid-template-columns: auto 1fr auto 1fr auto;
    align-items: center;
    gap: 8px;
    background: var(--surface);
    border-radius: 10px;
    box-shadow: var(--shadow);
    padding: 9px 8px 9px 12px;
  }

  .match-rating-line {
    display: flex;
    flex-wrap: wrap;
    gap: 4px 12px;
    padding: 0 8px 0 14px;
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 0.64rem;
    color: var(--ink-muted);
  }
  .match-rating-team { white-space: nowrap; }

  .match-type-badge {
    flex-shrink: 0;
    font-family: "Inter", sans-serif;
    font-size: 0.6rem;
    font-weight: 700;
    border-radius: 999px;
    padding: 3px 7px;
    white-space: nowrap;
  }
  .match-type-badge.league { color: var(--pitch-deep); background: var(--pitch-soft); }
  .match-type-badge.friendly { color: var(--ink-muted); background: var(--surface-2); }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .match-type-badge.league { color: var(--pitch); }
  }
  :root[data-theme="dark"] .match-type-badge.league { color: var(--pitch); }

  .match-team {
    font-family: "Oswald", "Arial Narrow", sans-serif;
    font-size: 0.82rem;
    font-weight: 500;
    color: var(--ink);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .match-team.right { text-align: right; }

  .match-score {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-weight: 700;
    font-size: 0.84rem;
    color: var(--pitch-deep);
    background: var(--pitch-soft);
    border-radius: 8px;
    padding: 3px 8px;
    text-align: center;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .match-score { color: var(--pitch); }
  }
  :root[data-theme="dark"] .match-score { color: var(--pitch); }

  .match-delete {
    width: 22px;
    height: 22px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--ink-muted);
    background: transparent;
    border: none;
    border-radius: 50%;
  }
  .match-delete svg { width: 13px; height: 13px; }

  .match-row-confirm {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    background: var(--relegation-soft);
    border-radius: 10px;
    padding: 8px 8px 8px 12px;
    font-size: 0.76rem;
    color: var(--ink-muted);
  }

  /* ---------- empty state ---------- */

  .empty {
    text-align: center;
    padding: 40px 20px;
    color: var(--ink-muted);
    font-size: 0.85rem;
    background: var(--surface);
    border-radius: 12px;
    box-shadow: var(--shadow);
  }

  /* ---------- FAB ---------- */

  .fab {
    position: fixed;
    right: 20px;
    bottom: calc(84px + env(safe-area-inset-bottom, 0px));
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: var(--pitch);
    color: var(--on-accent);
    border: none;
    box-shadow: 0 8px 22px -6px rgba(57, 255, 138, 0.6);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 30;
  }
  .fab::before {
    content: "";
    position: absolute;
    inset: -7px;
    border-radius: 50%;
    border: 2px dashed var(--pitch);
    opacity: 0.35;
    pointer-events: none;
  }
  .fab:active { transform: scale(0.94); }
  .fab svg { width: 24px; height: 24px; position: relative; }

  @media (prefers-reduced-motion: reduce) {
    .chevron, .detail, .history-chevron, .history-detail { transition: none; }
  }

  /* ==========================================================
     MNM 킬내기
     ========================================================== */

  .app-shell {
    width: 100%;
    max-width: 440px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  /* ---------- 하단 바텀 내비게이션 ---------- */
  /* 기존에는 상단 sticky 탭이었지만, 모바일 게임 앱처럼 화면 하단 고정
     내비게이션으로 위치만 바꿨다 — 버튼 id/클릭 이벤트는 그대로다. */
  .mode-switch {
    display: flex;
    gap: 2px;
    background: rgba(17, 22, 31, 0.92);
    -webkit-backdrop-filter: blur(14px);
    backdrop-filter: blur(14px);
    border-top: 1px solid var(--line);
    border-radius: 0;
    padding: 6px 8px calc(6px + env(safe-area-inset-bottom, 0px));
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 20;
    max-width: 440px;
    margin: 0 auto;
    box-shadow: 0 -8px 24px -12px rgba(0, 0, 0, 0.6);
  }

  .mode-btn {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    font-family: "Inter", sans-serif;
    font-size: 0.68rem;
    font-weight: 700;
    color: var(--ink-muted);
    background: transparent;
    border: none;
    border-radius: 12px;
    padding: 7px 0 6px;
    white-space: nowrap;
    min-height: 52px;
  }
  .mode-btn-icon {
    font-size: 1.28rem;
    line-height: 1;
    filter: grayscale(0.4) opacity(0.85);
  }
  .mode-btn-label {
    letter-spacing: 0.01em;
  }
  .mode-btn.active {
    color: var(--pitch);
    background: var(--pitch-soft);
  }
  .mode-btn.active .mode-btn-icon {
    filter: none;
    text-shadow: 0 0 12px rgba(57, 255, 138, 0.55);
  }
  /* PUBG 탭이 활성화됐을 때만 옐로/오렌지 포인트 컬러로 */
  #modeBtnPubg.active {
    color: var(--gold);
    background: var(--gold-soft);
  }
  #modeBtnPubg.active .mode-btn-icon {
    text-shadow: 0 0 12px rgba(255, 178, 36, 0.55);
  }

  .pubg-title {
    font-family: "Oswald", "Arial Narrow", sans-serif;
    font-weight: 700;
    font-size: 1.5rem;
    letter-spacing: 0.01em;
    color: var(--ink);
    text-shadow: 0 0 18px rgba(57, 255, 138, 0.25);
  }

  .pubg-card {
    display: flex;
    flex-direction: column;
    gap: 10px;
    background: var(--surface);
    border-radius: 16px;
    padding: 16px;
    box-shadow: var(--shadow);
  }

  .pubg-card-title {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 0.68rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--ink-muted);
    margin-top: 6px;
  }
  .pubg-card-title:first-child { margin-top: 0; }

  .pubg-target-input { width: 100%; text-align: left; font-size: 1rem; }

  /* ---------- 시즌 시작 전 팀/인원 구성(draft) ---------- */

  .pubg-draft-team-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .pubg-draft-team {
    display: flex;
    flex-direction: column;
    gap: 10px;
    background: var(--surface-2);
    border-radius: 12px;
    padding: 12px;
  }

  .pubg-draft-team-head {
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .pubg-draft-team-head .name-input { flex: 1; min-width: 0; background: var(--surface); }
  .pubg-draft-team-head .crest { flex-shrink: 0; }

  .pubg-member-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .pubg-member-row {
    display: flex;
    gap: 6px;
    align-items: center;
  }
  .pubg-member-row .name-input { flex: 1; min-width: 0; }
  .pubg-member-move {
    font-family: "Inter", sans-serif;
    font-size: 0.72rem;
    font-weight: 600;
    color: var(--ink-muted);
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 7px 4px;
    flex-shrink: 0;
    max-width: 84px;
  }
  .pubg-member-empty {
    font-size: 0.78rem;
    color: var(--ink-muted);

  var RATING_START = 1600;

  function streakWeight(length) {
    if (length >= 5) return 1.40;
    if (length === 4) return 1.25;
    if (length === 3) return 1.15;
    return 1.0;
  }

  // 승/패 스트릭 모두 끊긴 것으로 본다(길이 0, 타입 없음).
  function currentStreakInfo(teamId) {
    var all = state.allMatches || [];
    var length = 0, type = null;
    for (var i = all.length - 1; i >= 0; i--) {
      var m = all[i];
      if (m.teamAId !== teamId && m.teamBId !== teamId) continue;
      var isA = m.teamAId === teamId;
      var mine = isA ? m.scoreA : m.scoreB;
      var theirs = isA ? m.scoreB : m.scoreA;
      var result = mine > theirs ? "win" : (mine < theirs ? "loss" : "draw");
      if (result === "draw") break;
      if (type === null) { type = result; length = 1; }
      else if (result === type) { length++; }
      else break;
    }
    return { type: type, length: length };
  }

  // 레이팅(1600)과 변동량 null을 돌려준다.
  function ratingInfoForTeam(teamId) {
    var all = state.allMatches || [];
    for (var i = all.length - 1; i >= 0; i--) {
      var m = all[i];
      if (m.teamAId === teamId && m.ratingA) {
        return { rating: m.ratingA.after, delta: m.ratingA.delta };
      }
      if (m.teamBId === teamId && m.ratingB) {

  // 레이팅이 반영된 경기가 없으면) 빈 문자열을 돌려준다.
  function formatRatingDelta(delta) {
    if (delta == null) return "";
    if (delta > 0) return "↑" + delta;
    if (delta < 0) return "↓" + Math.abs(delta);
    return "±0";
  }

  // 두 팀의 경기 결과를 반영해 Elo 레이팅 변동을 계산한다.
  // - 기대 승률(eloExpected) 대비 실제 결과로 기본 변동량을 구하고,
  // - 각 팀 자신의 연승/연패 스트릭(이 경기를 포함한 길이)에 따라 가중치를 곱하고,
  // - 마지막으로 경기 유형(리그 100% / 친선전 50%)에 따라 한 번 더 줄인 뒤,
  // - 그 결과를 반올림해 정수로 확정한다(양쪽 팀 각각 독립적으로 반올림).
  function computeRatingChange(ratingA, ratingB, scoreA, scoreB, streakA, streakB, type) {
    var expectedA = eloExpected(ratingA, ratingB);
    var expectedB = 1 - expectedA;
    var actualA = scoreA > scoreB ? 1 : (scoreA < scoreB ? 0 : 0.5);
    var actualB = 1 - actualA;

    var baseDeltaA = ELO_K_FACTOR * (actualA - expectedA);
    var baseDeltaB = ELO_K_FACTOR * (actualB - expectedB);

    var resultA = actualA === 1 ? "win" : (actualA === 0 ? "loss" : "draw");
    var resultB = actualB === 1 ? "win" : (actualB === 0 ? "loss" : "draw");

    var newStreakLenA = resultA === "draw" ? 0 : (streakA.type === resultA ? streakA.length + 1 : 1);
    var newStreakLenB = resultB === "draw" ? 0 : (streakB.type === resultB ? streakB.length + 1 : 1);

    var typeFactor = type === "friendly" ? 0.5 : 1;

    var deltaA = Math.round(baseDeltaA * streakWeight(newStreakLenA) * typeFactor);
    var deltaB = Math.round(baseDeltaB * streakWeight(newStreakLenB) * typeFactor);

    return { deltaA: deltaA, deltaB: deltaB };
  }

  function winStreak(teamId) {
    var all = state.allMatches || [];
    var streak = 0;
    for (var i = all.length - 1; i >= 0; i--) {

      if (m.teamAId !== teamId && m.teamBId !== teamId) continue;
      var isA = m.teamAId === teamId;
      var mine = isA ? m.scoreA : m.scoreB;
      var theirs = isA ? m.scoreB : m.scoreA;
      if (mine > theirs) { streak++; } else { break; }

    return streak;

  // 남은 champion 스냅샷 이름을 기준으로 센다. 같은 이름으로 여러 번 우승했으면
  // 합산되고, 우승 횟수가 많은 순으로 정렬해 반환한다.
  function championCounts() {
    var counts = {};
    historyList.forEach(function (entry) {
      var champ = entry.champion || (entry.standings && entry.standings[0]);
      var name = champ && champ.name ? champ.name : "";
      if (!name) return;
      counts[name] = (counts[name] || 0) + 1;
    });
    return Object.keys(counts)
      .map(function (name) { return { name: name, count: counts[name] }; })
      .sort(function (a, b) {
        if (b.count !== a.count) return b.count - a.count;
        return a.name.localeCompare(b.name, "ko");
      });
  }

  // winStreak()은 "지금 이어지고 있는" 연승만 보지만, 이건 통산 기록 전체를
  // 처음부터 훑어 그 팀이 세운 최고 연승/연패 기록(진행 중이 아니어도)을 찾는다.
  function bestStreakFor(teamId) {
    var maxWin = 0, curWin = 0;
    var maxLoss = 0, curLoss = 0;
    (state.allMatches || []).forEach(function (m) {
      var isA = m.teamAId === teamId, isB = m.teamBId === teamId;
      if (!isA && !isB) return;
      var mine = isA ? m.scoreA : m.scoreB;
      var theirs = isA ? m.scoreB : m.scoreA;
      if (mine > theirs) { curWin++; curLoss = 0; }
      else if (mine < theirs) { curLoss++; curWin = 0; }
      else { curWin = 0; curLoss = 0; }
      if (curWin > maxWin) maxWin = curWin;
      if (curLoss > maxLoss) maxLoss = curLoss;
    });
    return { win: maxWin, loss: maxLoss };
  }

  // 통산 기록에 등장한 모든 팀(삭제된 팀 포함)을 통틀어 역대 최다 연승·최다
  // 연패 기록과 그 주인공(동률이면 여러 팀)을 찾는다.
  function streakRecords() {
    var ids = {};
    (state.allMatches || []).forEach(function (m) { ids[m.teamAId] = true; ids[m.teamBId] = true; });
    var bestWin = 0, winners = [];
    var bestLoss = 0, losers = [];
    Object.keys(ids).forEach(function (id) {
      var s = bestStreakFor(id);
      var name = teamNameById(id);
      if (s.win > 0) {
        if (s.win > bestWin) { bestWin = s.win; winners = [name]; }
        else if (s.win === bestWin) { winners.push(name); }
      }
      if (s.loss > 0) {
        if (s.loss > bestLoss) { bestLoss = s.loss; losers = [name]; }
        else if (s.loss === bestLoss) { losers.push(name); }
      }
    });
    return { win: { value: bestWin, names: winners }, loss: { value: bestLoss, names: losers } };
  }

  // 통산 전 경기를 두 팀의 시점에서 각각 살펴(한 팀의 득점 = 상대의 실점이므로
  // 같은 경기가 두 기록에 동시에 후보로 들어간다) 1경기 최다 득점·최다 실점
  // 기록을 찾는다.
  function scoreRecords() {
    var bestFor = null, bestAgainst = null;
    (state.allMatches || []).forEach(function (m) {
      var aName = teamNameById(m.teamAId);
      var bName = teamNameById(m.teamBId);
      var perspectives = [
        { team: aName, opponent: bName, scored: m.scoreA, conceded: m.scoreB },
        { team: bName, opponent: aName, scored: m.scoreB, conceded: m.scoreA }
      ];
      perspectives.forEach(function (p) {
        if (!bestFor || p.scored > bestFor.scored) bestFor = p;
        if (!bestAgainst || p.conceded > bestAgainst.conceded) bestAgainst = p;
      });
    });
    return { for: bestFor, against: bestAgainst };
  }

  // 재미 요소용 간단한 승부 예측 — 실제 AI 호출이 아니라, 통산 경기당 평균 승점과
  // 골득실 흐름을 섞은 가벼운 공식으로 확률을 흉내낸다. 통산 기록 기반이라
  // 시즌이 바뀌어 팀 성적이 0으로 리셋돼도 예측은 계속 이전 기록을 반영한다.
  function predictMatch(teamA, teamB) {
    var ca = allTimeStats(teamA.id);
    var cb = allTimeStats(teamB.id);
    if (ca.p === 0 && cb.p === 0) {
      return { note: "아직 경기 기록이 없어서 반반으로 예측할게요.", pctA: 50, pctB: 50 };
    }
    var ratingA = (ca.p ? ca.pts / ca.p : 1.2) * 3 + ca.gd * 0.15;
    var ratingB = (cb.p ? cb.pts / cb.p : 1.2) * 3 + cb.gd * 0.15;
    var pctA = Math.round(50 + (ratingA - ratingB) * 6);
    pctA = Math.max(8, Math.min(92, pctA));
    return { note: null, pctA: pctA, pctB: 100 - pctA };
  }

  function sortedTeams() {
    return state.teams
      .map(function (t) { return { team: t, c: computed(t) }; })
      .sort(function (a, b) {
        if (b.c.pts !== a.c.pts) return b.c.pts - a.c.pts;
        if (b.c.gd !== a.c.gd) return b.c.gd - a.c.gd;
        if (b.c.gf !== a.c.gf) return b.c.gf - a.c.gf;
        return a.team.name.localeCompare(b.team.name, "ko");
      });
  }

  // "전체 전적" 탭 전용 — 리그 순위(state.teams의 w/d/l/gf/ga, 리그 경기만 반영)와
  // 달리, 각 팀의 통산(리그+친선전) 기록을 allTimeStats()로 집계해 승률 순으로
  // 정렬한다. 삭제된 팀은 제외하고, 현재 남아있는 팀만 보여준다.
  function sortedTeamsOverall() {
    return state.teams
      .map(function (t) { return { team: t, s: allTimeStats(t.id), rating: ratingInfoForTeam(t.id) }; })
      .sort(function (a, b) {
        if (b.s.winRate !== a.s.winRate) return b.s.winRate - a.s.winRate;
        if (b.s.pts !== a.s.pts) return b.s.pts - a.s.pts;
        if (b.s.gd !== a.s.gd) return b.s.gd - a.s.gd;
        return a.team.name.localeCompare(b.team.name, "ko");
      });
  }

  function zoneFor(rank, total) {
    if (total >= 4 && rank === 1) return "leader";
    if (total >= 8 && rank >= 2 && rank <= 4) return "europa";
    if (total >= 6 && rank > total - 3) return "relegation";
    return "";
  }

  function zonesActive(total) {
    return { leader: total >= 4, europa: total >= 8, relegation: total >= 6 };
  }

  function escapeHtml(s) {
    if (s == null) return "";
    return String(s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");
  }

  function hashHue(str) {
    var h = 0;
    for (var i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) >>> 0;
    return h % 360;
  }

  // Accepts either a team-like object ({ name, color }) or a plain name
  // string, so call sites that only have a name (e.g. a champion snapshot
  // without a stored color) still work. A non-null team.color (a hue 0-359
  // chosen from the swatch picker) overrides the automatic name-hash color.
  function crestStyle(team) {
    var name = typeof team === "string" ? team : (team && team.name) || "?";
    var customHue = (team && typeof team === "object" && team.color != null) ? Number(team.color) : null;
    var hue = (customHue != null && !isNaN(customHue)) ? customHue : hashHue(name);
    var c1 = "hsl(" + hue + ", 55%, 42%)";
    var c2 = "hsl(" + hue + ", 55%, 28%)";
    return "background:linear-gradient(135deg," + c1 + " 50%," + c2 + " 50%)";
  }

  var COLOR_SWATCH_HUES = [0, 24, 45, 100, 150, 175, 205, 230, 265, 300, 330];

  function teamNameById(id) {
    var t = state.teams.find(function (x) { return x.id === id; });
    return t ? t.name : "삭제된 팀";
  }

  function initials(name) {
    var parts = (name || "").trim().split(/\s+/).filter(Boolean);
    if (parts.length === 0) return "?";
    if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
    return (parts[0][0] + parts[1][0]).toUpperCase();
  }

  function trophySvg(cls) {
    return '<svg class="' + cls + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4h10v4a5 5 0 0 1-10 0V4z"/><path d="M7 5H4a3 3 0 0 0 3 5"/><path d="M17 5h3a3 3 0 0 1-3 5"/><path d="M9.5 14.5h5L15 19h2v1H7v-1h2l.5-4.5z"/></svg>';
  }
  function formatDate(iso) {
    var d = new Date(iso);
    if (isNaN(d.getTime())) return "";
    return d.getFullYear() + "." + (d.getMonth() + 1) + "." + d.getDate();
  }

  var ICON_TROPHY = trophySvg("legend-icon");
  var ICON_UP = '<svg class="legend-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M6 11l6-6 6 6"/></svg>';
  var ICON_DOWN = '<svg class="legend-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M6 13l6 6 6-6"/></svg>';
  var ICON_MATCH = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M9 3v3h6V3"/><path d="M9 13l2 2 4-4"/></svg>';
  var ICON_TRASH = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2"/><path d="M19 6l-.9 14a2 2 0 0 1-2 1.9H7.9a2 2 0 0 1-2-1.9L5 6"/></svg>';

    if (total > 0) {
      html += '<div class="action-row">' +
        (total >= 2
          ? '<button class="match-btn" data-role="open-match" type="button">' + ICON_MATCH + '경기 입력</button>'
          : '') +
        '<button class="end-btn" data-role="open-champion" type="button">' + trophySvg("") + '시즌 종료</button>' +
        '</div>';
    }
    html += '</div>';

    html += '<div class="tabbar">' +
      '<button class="tab-btn' + (activeTab === "current" ? " active" : "") + '" data-role="tab-current" type="button">이번 시즌</button>' +
      '<button class="tab-btn' + (activeTab === "overall" ? " active" : "") + '" data-role="tab-overall" type="button">전체 전적</button>' +
      '<button class="tab-btn' + (activeTab === "history" ? " active" : "") + '" data-role="tab-history" type="button">시즌 기록' +
      (historyLoaded && historyList.length ? ' <span class="tab-count">' + historyList.length + '</span>' : '') +
      '</button>' +
      '</div>';

    if (activeTab === "history") {
      html += renderHistoryTab();
      if (championModalOpen) html += renderChampionModal(ranked, total);
      appEl.innerHTML = html;
      wireEvents();
      addBtn.style.display = "none";
      return;
    }

    if (activeTab === "overall") {
      html += renderOverallTab();
      appEl.innerHTML = html;
      wireEvents();
      addBtn.style.display = "none";
      return;
    }

    addBtn.style.display = "";

    if (total === 0) {
      html += '<div class="empty">아직 등록된 팀이 없어요.<br>오른쪽 아래 + 버튼으로 팀을 추가해보세요.</div>';
    } else {
      html += '<div class="col-caption"><span></span><span>순위</span><span></span><span>팀</span><span>경기</span><span>승점</span><span></span></div>';
      html += '<div class="table">';

      ranked.forEach(function (entry, idx) {
        var t = entry.team;
        var c = entry.c;
        var rank = idx + 1;
        var zone = zoneFor(rank, total);
        var isOpen = openId === t.id;

        html += '<div class="row' + (isOpen ? ' open' : '') + '" data-id="' + t.id + '">';
        html += '<div class="row-main" data-role="toggle" data-id="' + t.id + '">';
        html += '<div class="stripe ' + zone + '"></div>';
        html += '<div class="rank ' + (zone === "leader" ? "leader" : "") + '">' + rank + '</div>';
        html += '<div class="crest" style="' + crestStyle(t) + '">' + escapeHtml(initials(t.name)) + '</div>';
        var streak = winStreak(t.id);
        var teamRating = ratingInfoForTeam(t.id);
        var ratingDeltaCls = teamRating.delta == null ? "" : (teamRating.delta > 0 ? " up" : (teamRating.delta < 0 ? " down" : ""));
        html += '<div class="team-cell">';
        html += '<div class="team-name-line"><div class="team-name">' + escapeHtml(t.name || "이름 없음") + '</div>' +
          (streak >= 2 ? '<span class="streak-badge">🔥' + streak + '연승</span>' : '') +
          '</div>';
        html += '<div class="rating-line">Rating <span class="rating-value">' + teamRating.rating + '</span>' +
          (teamRating.delta != null ? '<span class="rating-delta' + ratingDeltaCls + '">' + formatRatingDelta(teamRating.delta) + '</span>' : '') +
          '</div>';
        html += '</div>';
        html += '<div class="played">' + c.p + '</div>';
        html += '<div class="pts-pill">' + c.pts + '</div>';
        html += '<svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>';
        html += '</div>';

        html += '<div class="detail"><div class="detail-inner"><div class="detail-body">';
        html += '<div class="name-field"><span class="field-label">팀 이름</span>' +
          '<input class="name-input" data-role="name" data-id="' + t.id + '" value="' + escapeHtml(t.name) + '" placeholder="팀 이름 입력" maxlength="24" /></div>';

        html += '<div class="color-field"><span class="field-label">팀 색상</span><div class="color-swatches">';
        COLOR_SWATCH_HUES.forEach(function (hue) {
          var isSelected = t.color != null && Number(t.color) === hue;
          html += '<button class="color-swatch' + (isSelected ? ' selected' : '') + '" data-role="color-swatch" data-id="' + t.id + '" data-hue="' + hue + '" style="background:hsl(' + hue + ',55%,42%)" type="button" aria-label="색상 선택"></button>';
        });
        html += '<button class="color-swatch auto' + (t.color == null ? ' selected' : '') + '" data-role="color-swatch" data-id="' + t.id + '" data-hue="" type="button" aria-label="자동 색상">' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 4v5h-5"/></svg></button>';
        html += '</div></div>';

        html += '<div class="stat-grid">';
        [["w", "승"], ["d", "무"], ["l", "패"], ["gf", "득점"], ["ga", "실점"]].forEach(function (f) {
          html += '<div class="stat-field"><span class="field-label">' + f[1] + '</span>' +
            '<input class="stat-input" type="number" inputmode="numeric" min="0" max="999" ' +
            'data-role="stat" data-field="' + f[0] + '" data-id="' + t.id + '" value="' + t[f[0]] + '" /></div>';
        });
        html += '</div>';

        html += '<div class="derived-row"><span>경기수 <b>' + c.p + '</b></span><span>득실차 <b>' + (c.gd > 0 ? "+" + c.gd : c.gd) + '</b></span><span>승점 <b>' + c.pts + '</b></span></div>';

        if (confirmDeleteId === t.id) {
          html += '<div class="confirm-row">삭제할까요? ' +
            '<button class="confirm-yes" data-role="confirm-delete" data-id="' + t.id + '" type="button">삭제</button>' +
            '<button class="confirm-no" data-role="cancel-delete" type="button">취소</button></div>';
        } else {
          html += '<div class="row-actions"><button class="delete-btn" data-role="delete" data-id="' + t.id + '" type="button">팀 삭제</button></div>';
        }

        html += '</div></div></div>';
        html += '</div>';
      });

      html += '</div>';

      if (zones.leader || zones.europa || zones.relegation) {
        html += '<div class="legend">';
        if (zones.leader) html += '<div class="legend-item" style="color:var(--gold)">' + ICON_TROPHY + '1위</div>';
        if (zones.europa) html += '<div class="legend-item" style="color:var(--europa)">' + ICON_UP + '상위권</div>';
        if (zones.relegation) html += '<div class="legend-item" style="color:var(--relegation)">' + ICON_DOWN + '강등권</div>';
        html += '</div>';
      }

      html += renderMatchList();
    }

    if (championModalOpen) {
      html += renderChampionModal(ranked, total);
    }
    if (matchModalOpen) {
      html += renderMatchModal();
    }

    appEl.innerHTML = html;
    wireEvents();
  }

  // 경기 유형 뱃지 — 기존 데이터에는 type이 없을 수 있으므로 항상
  // (m.type ?? "league") 방식으로 취급해 리그 경기로 fallback한다.
  function matchTypeOf(m) {
    return m && m.type === "friendly" ? "friendly" : "league";
  }
  function matchTypeBadge(m) {
    var type = matchTypeOf(m);
    return '<span class="match-type-badge ' + type + '">' + (type === "friendly" ? "친선" : "리그") + '</span>';
  }

  function renderMatchList() {
    var matches = state.matches || [];
    if (matches.length === 0) return "";
    var html = '<div class="match-list">';
    html += '<div class="match-list-title">경기 기록 <span class="tab-count">' + matches.length + '</span></div>';
    matches.forEach(function (m) {
      if (confirmDeleteMatchId === m.id) {
        html += '<div class="match-row-confirm">이 경기 기록을 삭제할까요? (' +
          (matchTypeOf(m) === "friendly" ? "친선전 기록만 지워지고 리그 순위는 그대로예요" : "결과가 리그 순위에서도 취소돼요") + ') ' +
          '<span style="display:flex;gap:6px;flex-shrink:0;">' +
          '<button class="confirm-yes" data-role="confirm-delete-match" data-id="' + m.id + '" type="button">삭제</button>' +
          '<button class="confirm-no" data-role="cancel-delete-match" type="button">취소</button></span></div>';
      } else {
        html += '<div class="match-row-wrap">';
        html += '<div class="match-row">';
        html += matchTypeBadge(m);
        html += '<span class="match-team">' + escapeHtml(teamNameById(m.teamAId)) + '</span>';
        html += '<span class="match-score">' + m.scoreA + ' - ' + m.scoreB + '</span>';
        html += '<span class="match-team right">' + escapeHtml(teamNameById(m.teamBId)) + '</span>';
        html += '<button class="match-delete" data-role="delete-match" data-id="' + m.id + '" type="button" aria-label="경기 기록 삭제">' + ICON_TRASH + '</button>';
        html += '</div>';
        html += renderMatchRatingLine(m);
        html += '</div>';
      }
    });
    html += '</div>';
    return html;
  }

  // 경기 하나의 레이팅 변동을 "A팀 1600 → 1624 (+24)" 형태로 표시한다. 레이팅
  // 정보가 없는(기능 추가 이전) 경기라면 빈 문자열을 돌려줘 아무것도 그리지 않는다.
  function renderMatchRatingLine(m) {
    if (!m.ratingA || !m.ratingB) return "";
    function part(teamId, r) {
      var cls = r.delta > 0 ? " up" : (r.delta < 0 ? " down" : "");
      var deltaStr = r.delta > 0 ? ("+" + r.delta) : String(r.delta);
      return '<span class="match-rating-team">' + escapeHtml(teamNameById(teamId)) + " " + r.before + " → " + r.after +
        ' <span class="rating-delta' + cls + '">(' + deltaStr + ')</span></span>';
    }
    return '<div class="match-rating-line">' + part(m.teamAId, m.ratingA) + part(m.teamBId, m.ratingB) + '</div>';
  }

  // "전체 전적" 탭 — 리그 순위와 별도로, 각 팀의 통산(리그+친선전) 경기 수·
  // 승/무/패·승률을 보여준다. 리그 테이블과 같은 카드/타이포그래피를 재사용하되
  // 컬럼 구성만 다르다.
  function renderOverallTab() {
    var rows = sortedTeamsOverall();
    var html = "";
    if (rows.length === 0) {
      html += '<div class="empty">아직 등록된 팀이 없어요.<br>오른쪽 아래 + 버튼으로 팀을 추가해보세요.</div>';
      return html;
    }
    html += '<div class="overall-caption"><span></span><span>팀</span><span>경기</span><span>승</span><span>무</span><span>패</span><span>승률</span><span>레이팅</span></div>';
    html += '<div class="overall-table">';
    rows.forEach(function (entry) {
      var t = entry.team;
      var s = entry.s;
      var r = entry.rating;
      var deltaCls = r.delta == null ? "" : (r.delta > 0 ? " up" : (r.delta < 0 ? " down" : ""));
      html += '<div class="overall-row">';
      html += '<div class="crest" style="' + crestStyle(t) + '">' + escapeHtml(initials(t.name)) + '</div>';
      html += '<div class="team-name">' + escapeHtml(t.name || "이름 없음") + '</div>';
      html += '<div class="played">' + s.p + '</div>';
      html += '<div class="played">' + s.w + '</div>';
      html += '<div class="played">' + s.d + '</div>';
      html += '<div class="played">' + s.l + '</div>';
      html += '<div class="pts-pill">' + s.winRate + '%</div>';
      html += '<div class="overall-rating"><span class="rating-value">' + r.rating + '</span>' +
        (r.delta != null ? '<span class="rating-delta' + deltaCls + '">' + formatRatingDelta(r.delta) + '</span>' : '') +
        '</div>';
      html += '</div>';
    });
    html += '</div>';
    html += '<div class="overall-hint">경기 수·승/무/패·승률·레이팅은 리그 경기와 친선전을 모두 합친 통산 기록이에요.</div>';
    return html;
  }

  var CONFETTI = [
    { top: "6%", left: "12%", size: 6, color: "var(--gold)" },
    { top: "14%", left: "82%", size: 5, color: "var(--europa)" },
    { top: "8%", left: "50%", size: 4, color: "var(--pitch)" },
    { top: "22%", left: "24%", size: 4, color: "var(--relegation)" },
    { top: "18%", left: "68%", size: 6, color: "var(--gold)" },
    { top: "30%", left: "8%", size: 4, color: "var(--pitch)" }
  ];

  function renderChampionModal(ranked, total) {
    var html = '<div class="modal-overlay" data-role="modal-backdrop">';
    html += '<div class="modal-card" role="dialog" aria-modal="true" aria-label="우승팀 발표">';
    html += '<div class="modal-field"></div>';
    CONFETTI.forEach(function (c) {
      html += '<span class="confetti-dot" style="top:' + c.top + ';left:' + c.left + ';width:' + c.size + 'px;height:' + c.size + 'px;background:' + c.color + '"></span>';
    });
    html += '<div class="modal-inner">';

    if (total === 0) {
      html += trophySvg("modal-trophy");
      html += '<div class="modal-empty">아직 등록된 팀이 없어요.<br>팀을 추가하고 순위를 채워보세요.</div>';
      html += '<div class="modal-actions"><button class="modal-close" data-role="close-modal" type="button">닫기</button></div>';
    } else {
      var champ = ranked[0];
      html += trophySvg("modal-trophy");
      html += '<div class="modal-eyebrow">현재 1위</div>';
      html += '<div class="modal-crest crest-lg" style="' + crestStyle(champ.team) + '">' + escapeHtml(initials(champ.team.name)) + '</div>';
      html += '<div class="modal-name">' + escapeHtml(champ.team.name) + '</div>';
      html += '<div class="modal-record"><span>' + champ.c.p + '경기</span><span><b>' + champ.team.w + '승 ' + champ.team.d + '무 ' + champ.team.l + '패</b></span><span>승점 <b>' + champ.c.pts + '</b></span></div>';

      html += '<div class="modal-actions">';
      html += '<button class="modal-confirm" data-role="confirm-end-season" type="button">시즌 종료하고 새 시즌 시작</button>';
      html += '<button class="modal-close" data-role="close-modal" type="button">닫기</button>';
      html += '</div>';
    }

    html += '</div></div></div>';
    return html;
  }

  function renderMatchModal() {
    var html = '<div class="modal-overlay" data-role="match-modal-backdrop">';
    html += '<div class="modal-card" role="dialog" aria-modal="true" aria-label="경기 결과 입력">';
    html += '<div class="modal-field"></div>';
    html += '<div class="modal-inner">';
    html += ICON_MATCH.replace('<svg ', '<svg class="modal-match-icon" ');
    html += '<div class="match-modal-title">경기 결과 입력</div>';

    html += '<div class="match-form">';

    html += '<div class="match-type-select" role="group" aria-label="경기 유형 선택">';
    html += '<button class="match-type-btn' + (matchType === "league" ? " active" : "") + '" data-role="match-type" data-type="league" type="button">리그</button>';
    html += '<button class="match-type-btn' + (matchType === "friendly" ? " active" : "") + '" data-role="match-type" data-type="friendly" type="button">친선전</button>';
    html += '</div>';
    html += '<div class="match-type-hint">' +
      (matchType === "friendly" ? "친선전은 전체 전적에만 반영되고 리그 순위에는 영향을 주지 않아요." : "리그 경기는 리그 순위와 전체 전적에 모두 반영돼요.") +
      '</div>';

    html += '<div class="match-pair">';
    html += '<select class="match-team-select" id="matchTeamASelect" data-role="match-team-a">';
    html += '<option value="">팀 선택</option>';
    state.teams.forEach(function (t) {
      html += '<option value="' + t.id + '"' + (matchTeamA === t.id ? ' selected' : '') + '>' + escapeHtml(t.name) + '</option>';
    });
    html += '</select>';
    html += '<input class="match-score-input" id="matchScoreAInput" type="number" inputmode="numeric" min="0" max="99" placeholder="0" value="' + escapeHtml(matchScoreA) + '" />';
    html += '</div>';

    html += '<div class="match-pair" style="justify-content:center;">';
    html += '<span class="match-vs">VS</span>';
    html += '</div>';

    html += '<div class="match-pair">';
    html += '<input class="match-score-input" id="matchScoreBInput" type="number" inputmode="numeric" min="0" max="99" placeholder="0" value="' + escapeHtml(matchScoreB) + '" />';
    html += '<select class="match-team-select" id="matchTeamBSelect" data-role="match-team-b">';
    html += '<option value="">팀 선택</option>';
    state.teams.forEach(function (t) {
      html += '<option value="' + t.id + '"' + (matchTeamB === t.id ? ' selected' : '') + '>' + escapeHtml(t.name) + '</option>';
    });
    html += '</select>';
    html += '</div>';

    if (matchTeamA && matchTeamB && matchTeamA !== matchTeamB) {
      var predTeamA = state.teams.find(function (t) { return t.id === matchTeamA; });
      var predTeamB = state.teams.find(function (t) { return t.id === matchTeamB; });
      if (predTeamA && predTeamB) {
        var pred = predictMatch(predTeamA, predTeamB);
        html += '<div class="match-predict">';
        html += '<span class="predict-label">🤖 AI 예측</span>';
        if (pred.note) {
          html += '<span class="predict-note">' + escapeHtml(pred.note) + '</span>';
        } else {
          html += '<div class="predict-bar"><span class="predict-fill" style="width:' + pred.pctA + '%"></span></div>';
          html += '<div class="predict-pcts"><span>' + escapeHtml(predTeamA.name) + ' ' + pred.pctA + '%</span>' +
            '<span>' + pred.pctB + '% ' + escapeHtml(predTeamB.name) + '</span></div>';
        }
        html += '</div>';
      }
    }

    if (matchError) {
      html += '<div class="match-error">' + escapeHtml(matchError) + '</div>';
    }
    html += '</div>';

    html += '<div class="modal-actions">';
    html += '<button class="modal-confirm" data-role="submit-match" type="button">결과 반영</button>';
    html += '<button class="modal-close" data-role="close-match-modal" type="button">닫기</button>';
    html += '</div>';

    html += '</div></div></div>';
    return html;
  }

  function recordCard(label, value, detail) {
    return '<div class="record-card"><div class="record-label">' + escapeHtml(label) + '</div>' +
      '<div class="record-value">' + escapeHtml(value) + '</div>' +
      '<div class="record-detail">' + escapeHtml(detail) + '</div></div>';
  }

  // 우승 횟수 · 최다 연승/연패 · 1경기 최다 득점/실점을 한 장에 모은 역대 기록
  // 카드. 시즌이 아직 하나도 끝나지 않았어도 경기 기록만 있으면 연승/득점 기록은
  // 보여주고, 아무 데이터도 없으면 아예 렌더링하지 않는다.
  function renderRecordsPanel() {
    var champs = championCounts();
    var streaks = streakRecords();
    var scores = scoreRecords();
    var hasAnything = champs.length > 0 || streaks.win.value > 0 || streaks.loss.value > 0 || scores.for || scores.against;
    if (!hasAnything) return "";

    var html = '<div class="records-panel">';
    html += '<div class="records-title">' + trophySvg("") + '<span>역대 기록</span></div>';

    if (champs.length) {
      html += '<div class="records-champs">';
      champs.forEach(function (c) {
        html += '<div class="champ-chip"><span class="champ-chip-name">' + escapeHtml(c.name) + '</span>' +
          '<span class="champ-chip-count">' + c.count + '회 우승</span></div>';
      });
      html += '</div>';
    }

    html += '<div class="records-grid">';
    html += recordCard(
      "최다 연승",
      streaks.win.value ? streaks.win.value + "연승" : "-",
      streaks.win.value ? streaks.win.names.join(", ") : "기록 없음"
    );
    html += recordCard(
      "최다 연패",
      streaks.loss.value ? streaks.loss.value + "연패" : "-",
      streaks.loss.value ? streaks.loss.names.join(", ") : "기록 없음"
    );
    html += recordCard(
      "1경기 최대 득점",
      scores.for ? scores.for.scored + "골" : "-",
      scores.for ? scores.for.team + " · vs " + scores.for.opponent + " (" + scores.for.scored + "-" + scores.for.conceded + ")" : "기록 없음"
    );
    html += recordCard(
      "1경기 최다 실점",
      scores.against ? scores.against.conceded + "실점" : "-",
      scores.against ? scores.against.team + " · vs " + scores.against.opponent + " (" + scores.against.conceded + "-" + scores.against.scored + ")" : "기록 없음"
    );
    html += '</div></div>';
    return html;
  }

  function renderHistoryTab() {
    var html = "";
    if (!historyLoaded) {
      html += '<div class="empty">기록을 불러오는 중이에요…</div>';
      return html;
    }
    html += renderRecordsPanel();
    if (historyList.length === 0) {
      html += '<div class="empty">' + trophySvg("modal-trophy") + '<br>아직 종료된 시즌이 없어요.<br>시즌을 종료하면 이곳에 우승 기록이 쌓여요.</div>';
      return html;
    }
    html += '<div class="history-list">';
    var visibleHistory = historyList.slice(0, historyVisibleCount);
    visibleHistory.forEach(function (entry) {
      var champ = entry.champion || (entry.standings && entry.standings[0]) || { name: "이름 없음", w: 0, d: 0, l: 0, p: 0, pts: 0 };
      var isOpen = openHistoryId === entry.id;
      html += '<div class="history-entry' + (isOpen ? ' open' : '') + '" data-id="' + entry.id + '">';
      html += '<div class="history-top" data-role="history-toggle" data-id="' + entry.id + '">';
      html += '<div class="crest-lg" style="' + crestStyle(champ) + '">' + escapeHtml(initials(champ.name)) + '</div>';
      html += '<div class="champion-info">';
      html += '<div class="champion-eyebrow">' + trophySvg("") + '<span>' + formatDate(entry.endedAt) + ' 종료 · 우승</span></div>';
      html += '<div class="champion-name">' + escapeHtml(champ.name) + '</div>';
      html += '<div class="champion-record">' + champ.p + '경기 ' + champ.w + '승 ' + champ.d + '무 ' + champ.l + '패 · 승점 ' + champ.pts + '</div>';
      html += '</div>';
      html += '<svg class="history-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>';
      html += '</div>';

      html += '<div class="history-detail"><div class="history-detail-inner"><div class="history-body">';

      if (Array.isArray(entry.standings) && entry.standings.length) {
        entry.standings.forEach(function (row, i) {
          html += '<div class="h-team-block">';
          html += '<div class="h-team-head"><span class="h-rank-badge">' + (i + 1) + '</span>' +
            '<input class="name-input" data-role="h-name" data-season="' + entry.id + '" data-team="' + i + '" value="' + escapeHtml(row.name) + '" maxlength="24" /></div>';
          html += '<div class="stat-grid">';
          [["w", "승"], ["d", "무"], ["l", "패"], ["gf", "득점"], ["ga", "실점"]].forEach(function (f) {
            html += '<div class="stat-field"><span class="field-label">' + f[1] + '</span>' +
              '<input class="stat-input" type="number" inputmode="numeric" min="0" max="999" ' +
              'data-role="h-stat" data-season="' + entry.id + '" data-team="' + i + '" data-field="' + f[0] + '" value="' + row[f[0]] + '" /></div>';
          });
          html += '</div>';
          html += '<div class="derived-row"><span>경기수 <b>' + row.p + '</b></span><span>득실차 <b>' + (row.gd > 0 ? "+" + row.gd : row.gd) + '</b></span><span>승점 <b>' + row.pts + '</b></span></div>';
          html += '</div>';
        });
      }

      if (confirmDeleteHistoryId === entry.id) {
        html += '<div class="confirm-row">이 시즌 기록을 삭제할까요? ' +
          '<button class="confirm-yes" data-role="confirm-delete-history" data-id="' + entry.id + '" type="button">삭제</button>' +
          '<button class="confirm-no" data-role="cancel-delete-history" type="button">취소</button></div>';
      } else {
        html += '<div class="row-actions"><button class="delete-btn" data-role="delete-history" data-id="' + entry.id + '" type="button">시즌 기록 삭제</button></div>';
      }

      html += '</div></div></div>';
      html += '</div>';
    });
    html += '</div>';

    if (historyList.length > visibleHistory.length) {
      var remaining = historyList.length - visibleHistory.length;
      var nextCount = Math.min(remaining, HISTORY_PAGE_SIZE);
      html += '<button class="load-more-btn" data-role="history-show-more" type="button">더 보기 · ' + nextCount + '개 더 (전체 ' + historyList.length + '개 중 ' + visibleHistory.length + '개 표시 중)</button>';
    }
    return html;
  }

  // Recomputes p/pts/gd for every team in an archived season record, re-sorts
  // by the same rules as the live table, and refreshes rank + champion —
  // called after editing any team's name or stats within season history.
  function recomputeHistoryRecord(entry) {
    entry.standings.forEach(function (row) {
      var c = computed(row);
      row.p = c.p;
      row.pts = c.pts;
      row.gd = c.gd;
    });
    entry.standings.sort(function (a, b) {
      if (b.pts !== a.pts) return b.pts - a.pts;
      if (b.gd !== a.gd) return b.gd - a.gd;
      if (b.gf !== a.gf) return b.gf - a.gf;
      return a.name.localeCompare(b.name, "ko");
    });
    entry.standings.forEach(function (row, i) { row.rank = i + 1; });
    entry.champion = entry.standings[0];
    entry.teamCount = entry.standings.length;
  }
