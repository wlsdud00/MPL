  function endSeason() {
    var ranked = sortedTeams();
    if (ranked.length === 0) return;

    var standings = ranked.map(function (entry, idx) {
      var t = entry.team;
      var c = entry.c;
      return { rank: idx + 1, name: t.name, w: t.w, d: t.d, l: t.l, gf: t.gf, ga: t.ga, p: c.p, pts: c.pts, gd: c.gd, color: (t.color != null ? t.color : null) };
    });
    var record = {
      leagueName: state.leagueName,
      endedAt: new Date().toISOString(),
      teamCount: standings.length,
      champion: standings[0],
      standings: standings
    };

    // 시즌 기록에 바로 반영 — historyList도 toDocBody()에 포함되므로 아래 persist()
    // 한 번으로 팀 리셋과 시즌 기록 추가가 함께 저장됨.
    var recordId = uid();
    var localRecord = Object.assign({ id: recordId }, record);
    historyList = [localRecord].concat(historyList.filter(function (r) { return r.id !== recordId; }));
    historyLoaded = true;

    // 이번 시즌에 뛴 경기들에 방금 만든 시즌 기록의 id를 붙여둔다 — state.matches와
    // state.allMatches는 같은 경기 객체를 공유하므로 이 한 번의 표시로 나중에
    // "시즌 기록 삭제" 시 통산 기록(연승/연패·최다 득점/실점)에서도 이 시즌 몫만
    // 정확히 골라 지울 수 있다.
    (state.matches || []).forEach(function (m) { m.seasonId = recordId; });

    state.teams = state.teams.map(function (t) {
      return { id: t.id, name: t.name, w: 0, d: 0, l: 0, gf: 0, ga: 0, color: (t.color != null ? t.color : null) };
    });
    state.matches = [];
    openId = null;
    confirmDeleteId = null;
    confirmDeleteMatchId = null;
    championModalOpen = false;
    activeTab = "history";
    persist();
    render();
  }

  // Applies one match's score to both teams' running w/d/l/gf/ga totals and
  // appends it to the current season's match log, so the standings are
  // always derived from entered results instead of hand-edited totals.
  function applyMatchResult() {
    var teamA = state.teams.find(function (t) { return t.id === matchTeamA; });
    var teamB = state.teams.find(function (t) { return t.id === matchTeamB; });
    if (!teamA || !teamB || teamA.id === teamB.id) return;

    var scoreA = parseInt(matchScoreA, 10);
    if (isNaN(scoreA) || scoreA < 0) scoreA = 0;
    if (scoreA > 99) scoreA = 99;
    var scoreB = parseInt(matchScoreB, 10);
    if (isNaN(scoreB) || scoreB < 0) scoreB = 0;
    if (scoreB > 99) scoreB = 99;

    var type = matchType === "friendly" ? "friendly" : "league";

    // 리그 경기만 팀의 승/무/패·득실(=리그 순위)에 반영한다. 친선전은 이
    // 블록을 건너뛰므로 리그 순위·승점·승무패에는 전혀 영향을 주지 않는다.
    if (type === "league") {
      teamA.gf += scoreA;
      teamA.ga += scoreB;
      teamB.gf += scoreB;
      teamB.ga += scoreA;
      if (scoreA > scoreB) {
        teamA.w += 1;
        teamB.l += 1;
      } else if (scoreA < scoreB) {
        teamB.w += 1;
        teamA.l += 1;
      } else {
        teamA.d += 1;
        teamB.d += 1;
      }
    }

    // 레이팅 계산은 리그/친선전 모두 대상이다(반영 비율만 다름) — 이 경기를
    // 반영하기 "직전" 시점의 레이팅과 연승/연패 스트릭을 먼저 구해둔다.
    var ratingBeforeA = ratingInfoForTeam(teamA.id).rating;
    var ratingBeforeB = ratingInfoForTeam(teamB.id).rating;
    var streakA = currentStreakInfo(teamA.id);
    var streakB = currentStreakInfo(teamB.id);
    var ratingChange = computeRatingChange(ratingBeforeA, ratingBeforeB, scoreA, scoreB, streakA, streakB, type);

    var record = {
      id: uid(),
      teamAId: teamA.id,
      teamBId: teamB.id,
      scoreA: scoreA,
      scoreB: scoreB,
      playedAt: new Date().toISOString(),
      // 이 경기가 어느 시즌 기록에 속하는지 — 시즌이 끝날 때 endSeason()이
      // 채워준다. 아직 진행 중인 시즌의 경기는 null.
      seasonId: null,
      // "league"(리그) | "friendly"(친선전). 리그 경기만 리그 순위에 반영되고,
      // 두 유형 모두 전체 경기 기록(state.matches/allMatches)에는 저장된다.
      type: type,
      // 이 경기 전/후 레이팅과 변동량 스냅샷 — 팀의 "현재 레이팅"은 이 값들을
      // allMatches에서 다시 훑어 구하므로(ratingInfoForTeam), 이 경기를 나중에
      // 삭제해도 별도 되돌리기 로직 없이 자동으로 그 이전 레이팅으로 복원된다.
      ratingA: { before: ratingBeforeA, after: ratingBeforeA + ratingChange.deltaA, delta: ratingChange.deltaA },
      ratingB: { before: ratingBeforeB, after: ratingBeforeB + ratingChange.deltaB, delta: ratingChange.deltaB }
    };
    // 리그든 친선전이든 "이번 시즌 경기 기록"과 "통산 전체 전적" 양쪽에 모두
    // 저장한다 — 리그 순위 반영 여부만 위에서 이미 갈렸을 뿐, 기록 자체는
    // 항상 함께 쌓인다(전체 전적 = 리그 + 친선전).
    state.matches = (state.matches || []).concat([record]);
    state.allMatches = (state.allMatches || []).concat([record]);
    exitExampleMode();
    persist();
  }

  // Reverses one match's effect on both teams (if they still exist) and
  // removes it from the log — used when a mis-entered result is deleted.
  function removeMatch(id) {
    var matches = state.matches || [];
    var m = matches.find(function (x) { return x.id === id; });
    if (!m) {
      confirmDeleteMatchId = null;
      render();
      return;
    }

    // 리그 경기일 때만 팀의 승/무/패·득실(=리그 순위)을 원상복구한다. 친선전은
    // 애초에 리그 순위에 반영된 적이 없으므로 이 블록을 건너뛰고, 아래에서
    // 전체 경기 기록에서만 지운다. 기존 데이터(type 없음)는 리그로 취급한다.
    if (matchTypeOf(m) === "league") {
      var teamA = state.teams.find(function (t) { return t.id === m.teamAId; });
      var teamB = state.teams.find(function (t) { return t.id === m.teamBId; });
      if (teamA) {
        teamA.gf -= m.scoreA;
        teamA.ga -= m.scoreB;
        if (m.scoreA > m.scoreB) teamA.w -= 1;
        else if (m.scoreA < m.scoreB) teamA.l -= 1;
        else teamA.d -= 1;
        ["w", "d", "l", "gf", "ga"].forEach(function (f) { if (teamA[f] < 0) teamA[f] = 0; });
      }
      if (teamB) {
        teamB.gf -= m.scoreB;
        teamB.ga -= m.scoreA;
        if (m.scoreB > m.scoreA) teamB.w -= 1;
        else if (m.scoreB < m.scoreA) teamB.l -= 1;
        else teamB.d -= 1;
        ["w", "d", "l", "gf", "ga"].forEach(function (f) { if (teamB[f] < 0) teamB[f] = 0; });
      }
    }

    state.matches = matches.filter(function (x) { return x.id !== id; });
    // 리그/친선전 모두 전체 경기 기록(통산 기록/연승/AI 예측용)에서는 함께 제외한다.
    state.allMatches = (state.allMatches || []).filter(function (x) { return x.id !== id; });
    confirmDeleteMatchId = null;
    persist();
    render();
  }

  function addTeam() {
    if (exampleMode) {
      exampleMode = false;
      state.teams = [];
    }
    var t = { id: uid(), name: "새 팀", w: 0, d: 0, l: 0, gf: 0, ga: 0, color: null };
    state.teams.push(t);
    openId = t.id;
    persist();
    render();
    var el = appEl.querySelector('[data-role="name"][data-id="' + t.id + '"]');
    if (el) { el.focus(); el.select(); }
  }

  addBtn.addEventListener("click", addTeam);

  /* ---------- persistence (Supabase) ---------- */

  var writing = false;
  var pendingWrite = false;
  var realtimeChannel = null;

  // 기존 app_state 테이블/행을 그대로 쓰되, data(jsonb) 안에서 축구(football)와
  // PUBG(pubg) 데이터를 완전히 독립된 객체로 나눠 저장한다. 새 테이블을 만들지
  // 않고, 한 행(row) 안에서 두 기능이 서로의 필드를 전혀 건드리지 않도록
  // 분리하는 것이 목적 — football.teams는 오직 축구 팀 목록이고, pubg 쪽은
  // 항상 자기 자신의 teams(참가자 구성)를 따로 들고 있어 football.teams를
  // 참가자 목록으로 재사용하는 일이 없다.
  function toDocBody() {
    return {
      football: {
        leagueName: state.leagueName,
        teams: state.teams,
        matches: state.matches,
        allMatches: state.allMatches,
        exampleMode: exampleMode,
        seasons: historyList
      },
      pubg: {
        currentSeason: state.pubg.currentSeason,
        seasons: state.pubg.seasons
      },
      randomOrder: {
        participants: state.randomOrder.participants,
        result: state.randomOrder.result
      }
    };
  }

  // 경기 전/후 레이팅 스냅샷({before, after, delta}) 정규화. 레이팅 기능이
  // 생기기 전에 저장된 경기이거나 값이 손상돼 있으면 null을 돌려주고,
  // ratingInfoForTeam()은 null인 경기를 만나면 그냥 건너뛴다.
  function normalizeRatingSnapshot(r) {
    if (!r || typeof r !== "object") return null;
    var before = Number(r.before);
    var after = Number(r.after);
    var delta = Number(r.delta);
    if (isNaN(before) || isNaN(after)) return null;
    return { before: before, after: after, delta: isNaN(delta) ? (after - before) : delta };
  }

  function normalizeMatch(m) {
    return {
      id: String(m.id || uid()),
      teamAId: String(m.teamAId || ""),
      teamBId: String(m.teamBId || ""),
      scoreA: Number(m.scoreA) || 0,
      scoreB: Number(m.scoreB) || 0,
      playedAt: String(m.playedAt || ""),
      seasonId: (m.seasonId == null) ? null : String(m.seasonId),
      // 기존에 저장된 경기에는 경기 유형(type) 필드가 없을 수 있다 — 그런
      // 경우는 항상 "league"(리그)로 취급해 기존 기록이 깨지지 않게 한다.
      type: (m.type === "friendly") ? "friendly" : "league",
      // 레이팅 기능이 생기기 전 경기에는 이 필드들이 없을 수 있다 — 그런
      // 경기는 null로 정규화되어 레이팅 계산(ratingInfoForTeam)에서 자동으로
      // 제외된다(그 다음 경기부터 1600을 기준으로 다시 계산이 시작됨).
      ratingA: normalizeRatingSnapshot(m.ratingA),
      ratingB: normalizeRatingSnapshot(m.ratingB)
    };
  }

  function persist() {
    if (!supabaseClient || !currentUserId) return; // 로그인 전에는 아무 데이터도 쓰지 않음
    scheduleWrite();
  }

  function scheduleWrite() {
    if (!currentUserId) return; // 저장 대기 중 로그아웃된 경우 안전장치
    if (writing) { pendingWrite = true; return; }
    writing = true;
    var body = toDocBody();
    var forUserId = currentUserId;
    // user_id에 UNIQUE 제약이 걸려 있으므로 onConflict: "user_id"로 upsert하면
    // 이 사용자의 행이 없으면 새로 만들고, 있으면 그 행만 갱신한다. id 컬럼은
    // 일부러 여기서 지정하지 않는다 — DB 쪽 기본값(gen_random_uuid())이
    // 알아서 채우고, 기존 행을 갱신할 때는 그 행의 id가 그대로 유지된다.
    Promise.resolve(
      supabaseClient.from("app_state").upsert(
        { user_id: forUserId, data: body, updated_at: new Date().toISOString() },
        { onConflict: "user_id" }
      )
    ).then(function (res) {
      if (res && res.error) throw res.error;
    }).catch(function () {
      /* last-writer-wins elsewhere, or transiently unavailable; next edit retries */
    }).then(function () {
      writing = false;
      if (pendingWrite) {
        pendingWrite = false;
        scheduleWrite();
      }
    });
  }

  function applyRemote(data) {
    if (!data) return;
    // football 데이터는 이제 data.football 객체 하나에 독립적으로 들어있다.
    // 다만 이 구조로 바뀌기 전에 이미 저장돼 있던 행(축구 필드가 data 바로
    // 아래에 평평하게 있던 시절)도 있을 수 있으므로, data.football이 없으면
    // data 자체를 축구 데이터로 보고 그대로 읽어 마이그레이션한다.
    var football = data.football || data;
    if (typeof football.leagueName === "string") state.leagueName = football.leagueName;
    if (Array.isArray(football.teams)) {
      state.teams = football.teams.map(function (t) {
        return {
          id: String(t.id || uid()),
          name: String(t.name || "이름 없음"),
          w: Number(t.w) || 0,
          d: Number(t.d) || 0,
          l: Number(t.l) || 0,
          gf: Number(t.gf) || 0,
          ga: Number(t.ga) || 0,
          color: (t.color === null || t.color === undefined || isNaN(Number(t.color))) ? null : Number(t.color)
        };
      });
    }
    if (Array.isArray(football.matches)) {
      state.matches = football.matches.map(normalizeMatch);
    }
    if (Array.isArray(football.allMatches)) {
      state.allMatches = football.allMatches.map(normalizeMatch);
    } else if (Array.isArray(football.matches)) {
      // 이전 버전 데이터(통산 기록 필드가 없던 시절)에서 넘어온 경우: 최소한
      // 지금 보이는 이번 시즌 경기라도 통산 기록의 시작점으로 삼는다.
      state.allMatches = state.matches.slice();
    }
    if (typeof football.exampleMode === "boolean") exampleMode = football.exampleMode;
    if (Array.isArray(football.seasons)) {
      historyList = football.seasons.map(function (s) {
        return {
          id: String(s.id || uid()),
          leagueName: String(s.leagueName || state.leagueName || ""),
          endedAt: String(s.endedAt || ""),
          teamCount: Number(s.teamCount) || (Array.isArray(s.standings) ? s.standings.length : 0),
          champion: s.champion || null,
          standings: Array.isArray(s.standings) ? s.standings : []
        };
      });
      historyList.sort(function (a, b) { return (b.endedAt || "").localeCompare(a.endedAt || ""); });
    }
    // 기존 app_state.data에 pubg 필드가 아예 없던 경우(이 기능이 생기기 전 데이터)
    // 에도 오류 없이 기본값으로 채워진다 — applyRemotePubg 내부에서 처리. pubg는
    // football 객체를 전혀 참조하지 않고 자기 자신의 teams(참가자 구성)만 쓴다.
    applyRemotePubg(data.pubg);

    // 🎲 순서 정하기: football/pubg와 마찬가지로 완전히 독립된 자기 객체만
    // 읽는다. randomOrder 필드 자체가 없던 예전 데이터(이 기능이 생기기 전에
    // 저장된 계정)를 불러와도 오류 없이 기본값(빈 참가자/빈 결과)으로
    // 채워진다.
    applyRemoteRandomOrder(data.randomOrder);
  }

  /* ==========================================================
     🎲 순서 정하기 — 데이터 로직
     ========================================================== */

  function applyRemoteRandomOrder(randomOrder) {
    var participants = [];
    if (randomOrder && Array.isArray(randomOrder.participants)) {
      participants = randomOrder.participants.map(function (p) {
        return { id: String((p && p.id) || uid()), name: String((p && p.name) || "") };
      });
    }
    var participantIds = {};
    participants.forEach(function (p) { participantIds[p.id] = true; });

    var result = [];
    if (randomOrder && Array.isArray(randomOrder.result)) {
      // 방어적 처리: 결과 안에 이제는 존재하지 않는 참가자 id가 섞여 있어도
      // (예: 다른 기기에서 삭제와 동시에 저장이 겹친 경우) 화면에는 실제
      // 남아있는 참가자만 보여준다.
      result = randomOrder.result
        .map(function (id) { return String(id); })
        .filter(function (id) { return participantIds[id]; });
    }
    state.randomOrder = { participants: participants, result: result };
  }

  /* ==========================================================
     PUBG 킬내기 — 데이터 로직
     축구 데이터(state.teams/matches/allMatches, historyList)는 위에서 전혀
     건드리지 않고, 이 아래 함수들은 오직 state.pubg만 읽고 쓴다.
     ========================================================== */

  // 한 팀의 한 게임 점수 = -(그 팀 자신의 인원 수) + 킬 수 + 추가점수.
  // "전체 참가 인원"(모든 팀 합계)이 아니라 그 팀 자체의 인원 수를 뺀다 —
  // 팀마다 인원수가 다르면 팀별 기본 점수도 서로 다르다.
  // 항상 이 공식으로 다시 계산할 수 있으므로 game 레코드 자체에는 저장하지 않는다.
  function pubgGameScore(teamMemberCount, kills, bonus) {
    var k = parseInt(kills, 10); if (isNaN(k)) k = 0;
    var b = parseInt(bonus, 10); if (isNaN(b)) b = 0;
    return -teamMemberCount + k + b;
  }

  function pubgTeamNames(list) {
    var names = (list || []).map(function (p) { return p.name; }).filter(Boolean);
    return names.length ? names.join(" · ") : "이름 없음";
  }

  // 전체 참가 인원 = 모든 팀의 members.length 합계. 절대 별도 값으로 저장하지
  // 않고 항상 teams 배열에서 그때그때 계산한다.
  function pubgTotalParticipants(teams) {
    return (teams || []).reduce(function (sum, t) { return sum + ((t.members || []).length); }, 0);
  }

  // games 배열 "전체"를 처음부터 다시 훑어 팀별 누적 점수·연장전 여부·승리팀·
  // 상태를 계산한다 — 절대 기존 누적값에 더하고 빼는 방식을 쓰지 않는다. 그래야
  // 게임을 수정/삭제해도 항상 정확한 상태가 나온다. team1/team2 같은 고정
  // 슬롯이 아니라 teamId를 key로 하는 scores 맵을 사용해 몇 개 팀이든 그대로
  // 동작한다.
  //
  // 규칙:
  // - 어떤 팀이든 누적 점수가 목표 점수 이상이 되고, 그 팀이 "유일하게" 가장
  //   높은 점수라면 그 팀 승리.
  // - 목표 점수 이상인 최고 점수를 "여러 팀이 동시에" 공유하면(동점) 승리
  //   처리하지 않고 "연장전" 상태가 된다.
  // - 연장전 상태에 들어간 뒤로는(그다음 기록부터) 목표 점수는 더 이상 보지
  //   않고, 그때그때 전체 팀의 누적 점수만 비교해서 유일한 최고 점수 팀이
  //   나오면 승리, 여전히 여러 팀이 동점으로 최고면 계속 연장전.
  //
  // season.games는 "한 게임에 모든 팀이 동시에" 결과를 남기는 구조가 아니라,
  // 팀마다 자기 게임을 자기 속도로 따로 입력하는 구조다 — 각 원소가
  // { id, teamId, playedAt, bonus, players } 형태의 "그 팀의 게임 한 판" 기록.
  // 그래서 팀마다 지금까지 입력한 게임 수가 서로 달라도 전혀 문제없다. 이
  // 배열은 입력된 순서(시간순) 그대로이고, 그 순서대로 하나씩 반영하면서
  // "그 시점"의 전체 팀 점수를 기준으로 승리/연장전을 판단한다.
  function recomputePubgSeason(season) {
    var teams = season.teams || [];
    // "전체 참가 인원"은 설정 화면에 보여주는 정보용 합계일 뿐, 점수 계산에는
    // 쓰지 않는다 — 점수는 항상 그 팀 자신의 인원 수를 기준으로 뺀다.
    var totalParticipants = pubgTotalParticipants(teams);
    var scores = {};
    var teamGameCounts = {};
    teams.forEach(function (t) { scores[t.id] = 0; teamGameCounts[t.id] = 0; });
    var overtime = false;
    var winnerTeamId = null;
    var teamIds = teams.map(function (t) { return t.id; });

    (season.games || []).forEach(function (e) {
      var team = teams.find(function (t) { return t.id === e.teamId; });
      if (!team) { e.teamGameNumber = 0; return; } // 안전장치: 팀이 사라진 옛 데이터

      teamGameCounts[e.teamId] = (teamGameCounts[e.teamId] || 0) + 1;
      e.teamGameNumber = teamGameCounts[e.teamId]; // 그 팀 기준 몇 번째 게임인지(표시용)

      var teamCount = (team.members || []).length;
      var kills = (e.players || []).reduce(function (sum, p) { return sum + (Number(p.kills) || 0); }, 0);
      scores[e.teamId] += pubgGameScore(teamCount, kills, e.bonus);

      var maxScore = teamIds.length ? Math.max.apply(null, teamIds.map(function (id) { return scores[id]; })) : 0;
      var leaders = teamIds.filter(function (id) { return scores[id] === maxScore; });

      if (overtime) {
        if (leaders.length === 1) { winnerTeamId = leaders[0]; overtime = false; }
        else { winnerTeamId = null; /* 계속 연장전 */ }
      } else if (maxScore >= season.targetScore) {
        if (leaders.length === 1) { winnerTeamId = leaders[0]; }
        else { winnerTeamId = null; overtime = true; }
      } else {
        winnerTeamId = null;
      }
    });

    season.totalParticipants = totalParticipants;
    season.scores = scores;
    season.teamGameCounts = teamGameCounts;
    season.overtime = overtime;
    season.winnerTeamId = winnerTeamId;
    season.status = winnerTeamId ? "won" : (overtime ? "overtime" : "playing");
    return season;
  }

  /* ---------- 시즌 시작 전 설정(draft): 팀 추가 → 팀 이름 → 팀별 인원 추가 ---------- */

  function addPubgDraftTeam() {
    if (state.pubg.currentSeason) return; // 시즌 시작 후에는 절대 변경 불가
    pubgDraftTeams.push({ id: uid(), name: "", members: [] });
    pubgSetupError = "";
    renderPubg();
  }

  function deletePubgDraftTeam(teamId) {
    if (state.pubg.currentSeason) return; // 시즌 시작 전(=draft)에서만 가능
    pubgDraftTeams = pubgDraftTeams.filter(function (t) { return t.id !== teamId; });
    renderPubg();
  }

  function setPubgDraftTeamName(teamId, value) {
    if (state.pubg.currentSeason) return;
    var t = pubgDraftTeams.find(function (x) { return x.id === teamId; });
    if (t) t.name = value;
  }

  function addPubgDraftMember(teamId) {
    if (state.pubg.currentSeason) return;
    var t = pubgDraftTeams.find(function (x) { return x.id === teamId; });
    if (!t) return;
    t.members.push({ id: uid(), name: "" });
    renderPubg();
  }

  function deletePubgDraftMember(teamId, memberId) {
    if (state.pubg.currentSeason) return;
    var t = pubgDraftTeams.find(function (x) { return x.id === teamId; });
    if (!t) return;
    t.members = t.members.filter(function (m) { return m.id !== memberId; });
    renderPubg();
  }

  function setPubgDraftMemberName(teamId, memberId, value) {
    if (state.pubg.currentSeason) return;
    var t = pubgDraftTeams.find(function (x) { return x.id === teamId; });
    if (!t) return;
    var m = t.members.find(function (x) { return x.id === memberId; });
    if (m) m.name = value;
  }

  // 참가자를 다른 팀으로 이동 — 이름/기록은 그대로 유지한 채 소속 팀만 바뀐다.
  function movePubgDraftMember(fromTeamId, memberId, toTeamId) {
    if (state.pubg.currentSeason) return;
    if (fromTeamId === toTeamId) return;
    var from = pubgDraftTeams.find(function (x) { return x.id === fromTeamId; });
    var to = pubgDraftTeams.find(function (x) { return x.id === toTeamId; });
    if (!from || !to) return;
    var idx = from.members.findIndex(function (m) { return m.id === memberId; });
    if (idx === -1) return;
    var member = from.members.splice(idx, 1)[0];
    to.members.push(member);
    renderPubg();
  }

  function setPubgDraftTarget(value) {
    if (state.pubg.currentSeason) return;
    pubgDraftTarget = value;
  }

  function pubgDraftTotalParticipants() {
    return pubgTotalParticipants(pubgDraftTeams);
  }

  // 같은 참가자 이름이 둘 이상의 팀에 동시에 등록되어 있으면 안 된다(트림 후
  // 대소문자 구분 없이 비교). 중복된 이름이 있으면 그 이름 목록을 돌려준다.
  function pubgDraftDuplicateNames() {
    var seen = {};
    var dupes = {};
    pubgDraftTeams.forEach(function (t) {
      (t.members || []).forEach(function (m) {
        var key = (m.name || "").trim().toLowerCase();
        if (!key) return;
        if (seen[key]) dupes[key] = true;
        seen[key] = true;
      });
    });
    return Object.keys(dupes);
  }

  // 시즌 시작 조건을 검사해 문제가 있으면 이유를 문자열로 돌려주고, 문제가
  // 없으면 null을 돌려준다.
  function pubgSetupValidationError() {
    if (pubgDraftTeams.length < 2) return "최소 2개 팀이 있어야 시즌을 시작할 수 있어요.";
    for (var i = 0; i < pubgDraftTeams.length; i++) {
      var t = pubgDraftTeams[i];
      if (!t.name || !t.name.trim()) return "모든 팀에 이름을 입력해주세요.";
      if (!t.members || t.members.length === 0) return "모든 팀에 최소 1명의 인원이 있어야 해요.";
      for (var j = 0; j < t.members.length; j++) {
        if (!t.members[j].name || !t.members[j].name.trim()) return "모든 참가자 이름을 입력해주세요.";
      }
    }
    if (pubgDraftDuplicateNames().length > 0) return "같은 참가자 이름이 여러 팀에 등록되어 있어요.";
    var target = parseInt(pubgDraftTarget, 10);
    if (isNaN(target) || target <= 0) return "목표 점수를 입력해주세요.";
    return null;
  }

  function pubgSetupValid() {
    if (state.pubg.currentSeason) return false;
    return pubgSetupValidationError() === null;
  }

  // "시즌 시작" 버튼 — 이 순간 팀 수/팀 이름/각 팀의 인원 구성/전체 참가
  // 인원/목표 점수가 전부 state.pubg.currentSeason 안으로 확정되어 잠긴다.
  // 시즌 진행 중에는 이 값들을 바꾸는 UI 자체가 없고, 위 draft 관련 함수들도
  // currentSeason이 있으면 아무것도 하지 않도록 되어 있어 이중으로 막혀 있다.
  function startPubgSeason() {
    var err = pubgSetupValidationError();
    if (err) {
      pubgSetupError = err;
      renderPubg();
      return;
    }
    var teams = pubgDraftTeams.map(function (t) {
      return {
        id: t.id,
        name: t.name.trim(),
        members: t.members.map(function (m) { return { id: m.id, name: m.name.trim() }; })
      };
    });
    var season = {
      id: uid(),
      seasonNumber: state.pubg.seasons.length + 1,
      status: "playing",
      startedAt: new Date().toISOString(),
      endedAt: null,
      targetScore: parseInt(pubgDraftTarget, 10),
      teams: teams,
      games: []
    };
    recomputePubgSeason(season);
    state.pubg.currentSeason = season;

    // 다음 시즌을 위해 설정 화면 초기값으로 되돌려둔다.
    pubgDraftTeams = [];
    pubgDraftTarget = "20";
    pubgSetupError = "";

    persist();
    renderPubg();
  }

  /* ---------- 게임 결과 입력/수정/삭제 (팀마다 각자 따로 입력) ---------- */

  // teamId가 지금 이 모달의 대상 팀. editId가 null이면 "그 팀의 새 게임"이고,
  // 아니면 "그 팀이 이미 입력해둔 게임(entryId) 수정"이다. 다른 팀이 몇 게임을
  // 입력했는지는 전혀 신경 쓰지 않는다 — 팀마다 자기 속도로 따로 쌓인다.
  function openPubgEntryModal(teamId, editId) {
    var season = state.pubg.currentSeason;
    if (!season) return;
    var team = season.teams.find(function (t) { return t.id === teamId; });
    if (!team) return;
    if (season.status === "won" && !editId) return; // 승리 후에는 새 게임 추가 불가(수정은 허용)

    pubgEntryModalOpen = true;
    pubgEntryModalTeamId = teamId;
    pubgEntryModalEditId = editId || null;
    pubgEntryError = "";
    pubgEntryKills = {};
    pubgEntryBonus = "";

    if (editId) {
      var e = season.games.find(function (x) { return x.id === editId && x.teamId === teamId; });
      if (e) {
        var byMember = {};
        (e.players || []).forEach(function (p) { byMember[p.memberId] = p.kills; });
        team.members.forEach(function (m) { pubgEntryKills[m.id] = String(byMember[m.id] || 0); });
        pubgEntryBonus = String(e.bonus || 0);
      }
    } else {
      team.members.forEach(function (m) { pubgEntryKills[m.id] = ""; });
      pubgEntryBonus = "";
    }
    renderPubg();
  }

  function closePubgEntryModal() {
    pubgEntryModalOpen = false;
    renderPubg();
  }

  function savePubgEntryResult() {
    var season = state.pubg.currentSeason;
    if (!season) return;
    var team = season.teams.find(function (t) { return t.id === pubgEntryModalTeamId; });
    if (!team) return;
    if (season.status === "won" && !pubgEntryModalEditId) return;

    var players = team.members.map(function (m) {
      var k = parseInt(pubgEntryKills[m.id], 10); if (isNaN(k) || k < 0) k = 0;
      if (k > 999) k = 999;
      return { memberId: m.id, kills: k };
    });
    var b = parseInt(pubgEntryBonus, 10); if (isNaN(b)) b = 0;
    if (b > 999) b = 999; if (b < -999) b = -999;

    if (pubgEntryModalEditId) {
      var existing = season.games.find(function (x) { return x.id === pubgEntryModalEditId && x.teamId === team.id; });
      if (existing) { existing.bonus = b; existing.players = players; }
    } else {
      season.games.push({
        id: uid(),
        teamId: team.id,
        playedAt: new Date().toISOString(),
        bonus: b,
        players: players
      });
    }
    // 승리 상태를 포함해 전부 games 배열 기준으로 다시 계산 — 수정으로 이미
    // 확정됐던 승리가 취소되고 다시 진행 상태로 돌아갈 수도 있다.
    recomputePubgSeason(season);
    pubgEntryModalOpen = false;
    pubgEntryModalEditId = null;
    persist();
    renderPubg();
  }

  function deletePubgGame(id) {
    var season = state.pubg.currentSeason;
    if (!season) return;
    season.games = season.games.filter(function (g) { return g.id !== id; });
    recomputePubgSeason(season);
    confirmDeletePubgGameId = null;
    persist();
    renderPubg();
  }

  // 승리 확정 후 "시즌 결과 저장" — 현재 시즌을 PUBG 시즌 기록으로 옮기고
  // currentSeason을 비워 설정 화면(=새 시즌 시작)으로 돌아간다. 이전 기록은
  // 지우지 않는다.
  function archivePubgSeason() {
    var season = state.pubg.currentSeason;
    if (!season || season.status !== "won") return;
    var finalScores = season.teams.map(function (t) {
      return { teamId: t.id, name: t.name, score: season.scores[t.id] || 0 };
    }).sort(function (a, b) { return b.score - a.score; });
    var winnerTeam = season.teams.find(function (t) { return t.id === season.winnerTeamId; });
    var record = {
      id: season.id,
      seasonNumber: season.seasonNumber,
      startedAt: season.startedAt,
      endedAt: new Date().toISOString(),
      targetScore: season.targetScore,
      teams: season.teams,
      finalScores: finalScores,
      winnerTeamId: season.winnerTeamId,
      winnerName: winnerTeam ? winnerTeam.name : "",
      gamesCount: season.games.length,
      games: season.games
    };
    state.pubg.seasons = [record].concat(state.pubg.seasons);
    state.pubg.currentSeason = null;
    persist();
    renderPubg();
  }

  // 이미 종료(기록으로 저장)된 PUBG 시즌을 "시즌 기록"에서 삭제한다. 축구의
  // 시즌 기록 삭제와 달리 PUBG의 "역대 기록"(우승 횟수·최다 게임·최고 점수)은
  // 별도의 통산 기록 배열이 아니라 항상 state.pubg.seasons 자체를 그때그때
  // 다시 훑어 계산하므로, 이 배열에서 지우기만 하면 역대 기록에서도 자동으로
  // 함께 빠진다 — 축구처럼 allMatches 같은 별도 정리가 필요 없다. 진행 중인
  // 시즌(state.pubg.currentSeason)에는 전혀 영향 없다.
  function deletePubgHistoryEntry(id) {
    state.pubg.seasons = state.pubg.seasons.filter(function (s) { return s.id !== id; });
    confirmDeletePubgHistoryId = null;
    if (openPubgHistoryId === id) openPubgHistoryId = null;
    persist();
    renderPubg();
  }

  // 역대 기록 — 우승 횟수는 "몇 번째로 만든 팀인지"가 아니라 팀 "이름"으로
  // 집계한다(축구의 championCounts()와 동일한 방식). 같은 이름을 계속 쓰면
  // 계속 쌓이고, 이름이 다르면 다른 팀으로 취급된다.
  function pubgChampionCounts() {
    var counts = {};
    state.pubg.seasons.forEach(function (s) {
      var name = s.winnerName || "";
      if (!name) return;
      counts[name] = (counts[name] || 0) + 1;
    });
    return Object.keys(counts)
      .map(function (name) { return { name: name, count: counts[name] }; })
      .sort(function (a, b) {
        if (b.count !== a.count) return b.count - a.count;
        return a.name.localeCompare(b.name, "ko");
      });
  }

  function pubgRecords() {
    var seasons = state.pubg.seasons;
    var mostGames = null;
    var highScore = null;
    seasons.forEach(function (s) {
      if (!mostGames || s.gamesCount > mostGames.count) {
        mostGames = { count: s.gamesCount, seasonNumber: s.seasonNumber };
      }
      var top = (s.finalScores && s.finalScores[0]) || null;
      if (top && (!highScore || top.score > highScore.value)) {
        highScore = { value: top.score, seasonNumber: s.seasonNumber, name: top.name };
      }
    });
    return {
      totalSeasons: seasons.length,
      champions: pubgChampionCounts(),
      mostGames: mostGames,
      highScore: highScore
    };
  }

  // 그 시즌(teams 스냅샷 + games 기록)을 훑어 참가자 개인별 누적 킬 수를 구하고,
  // 그중 1등(들)과 꼴등(들)을 돌려준다. 동률이면 여러 명이 될 수 있다. 개인별
  // 킬 입력이 생기기 전의 옛 게임 기록(memberId 없이 팀 합계만 있던 경우)은
  // 팀 점수 계산에는 그대로 들어가지만 이 개인 집계에서는 제외된다.
  function pubgPlayerKillLeaders(teams, games) {
    var totals = {};
    (teams || []).forEach(function (t) {
      (t.members || []).forEach(function (m) {
        totals[m.id] = { memberId: m.id, name: m.name, teamName: t.name, kills: 0 };
      });
    });
    (games || []).forEach(function (g) {
      (g.players || []).forEach(function (p) {
        if (p.memberId && totals[p.memberId]) totals[p.memberId].kills += (Number(p.kills) || 0);
      });
    });
    var list = Object.keys(totals).map(function (id) { return totals[id]; });
    if (!list.length) return { top: [], bottom: [] };
    var maxK = Math.max.apply(null, list.map(function (x) { return x.kills; }));
    var minK = Math.min.apply(null, list.map(function (x) { return x.kills; }));
    return {
      top: list.filter(function (x) { return x.kills === maxK; }),
      bottom: (maxK === minK) ? [] : list.filter(function (x) { return x.kills === minK; })
    };
  }

  /* ---------- 원격 데이터 정규화 ---------- */

  function normalizePubgMember(p) {
    return { id: String((p && p.id) || uid()), name: String((p && p.name) || "") };
  }

  function normalizePubgTeam(t) {
    return {
      id: String((t && t.id) || uid()),
      name: String((t && t.name) || ""),
      members: Array.isArray(t && t.members) ? t.members.map(normalizePubgMember) : []
    };
  }

  function normalizePubgPlayerKill(p) {
    return { memberId: String((p && p.memberId) || ""), kills: Number(p && p.kills) || 0 };
  }

  // season.games는 팀마다 자기 게임을 따로 쌓는 배열이라, 원소 하나가 곧
  // "그 팀의 게임 한 판" 기록이다: { id, teamId, playedAt, bonus, players }.
  // 예전 버전(모든 팀이 한 게임에 동시에 results 배열로 결과를 남기던 시절,
  // 그리고 그보다 더 예전의 팀 단위 kills 하나만 있던 시절)의 데이터가 들어와도
  // 팀별 낱개 기록으로 풀어서 그대로 호환되게 만든다.
  function normalizePubgGames(rawGames) {
    var out = [];
    (Array.isArray(rawGames) ? rawGames : []).forEach(function (g) {
      if (!g) return;
      if (Array.isArray(g.results)) {
        // 옛 "동시 입력" 구조 — 한 게임에 묶여 있던 팀별 결과를 낱개로 쪼갠다.
        g.results.forEach(function (r) {
          var players = Array.isArray(r && r.players)
            ? r.players.map(normalizePubgPlayerKill)
            // 그보다 더 예전(개인별 킬 입력이 생기기 전) 데이터 호환 — 특정
            // 인원에게 배분할 수 없으므로 memberId 없이 합계만 유지한다.
            : [{ memberId: "", kills: Number(r && r.kills) || 0 }];
          out.push({
            id: uid(),
            teamId: String((r && r.teamId) || ""),
            playedAt: String(g.playedAt || ""),
            bonus: Number(r && r.bonus) || 0,
            players: players
          });
        });
      } else {
        out.push({
          id: String(g.id || uid()),
          teamId: String(g.teamId || ""),
          playedAt: String(g.playedAt || ""),
          bonus: Number(g.bonus) || 0,
          players: Array.isArray(g.players) ? g.players.map(normalizePubgPlayerKill) : []
        });
      }
    });
    return out;
  }

  function normalizePubgCurrentSeason(s) {
    var season = {
      id: String(s.id || uid()),
      seasonNumber: Number(s.seasonNumber) || 1,
      status: "playing", // recomputePubgSeason이 아래에서 다시 정확히 채운다
      startedAt: String(s.startedAt || ""),
      endedAt: s.endedAt || null,
      targetScore: Number(s.targetScore) || 20,
      teams: Array.isArray(s.teams) ? s.teams.map(normalizePubgTeam) : [],
      games: normalizePubgGames(s.games)
    };
    // 저장된 누적 점수/상태를 그대로 믿지 않고 games 배열로부터 다시 계산 —
    // 데이터가 어긋나 있어도 항상 일관된 값이 나오도록 한다.
    recomputePubgSeason(season);
    return season;
  }

  function normalizePubgHistoryEntry(s) {
    var teams = Array.isArray(s.teams) ? s.teams.map(normalizePubgTeam) : [];
    var finalScores = Array.isArray(s.finalScores)
      ? s.finalScores.map(function (f) {
          return { teamId: String((f && f.teamId) || ""), name: String((f && f.name) || ""), score: Number(f && f.score) || 0 };
        })
      : teams.map(function (t) { return { teamId: t.id, name: t.name, score: 0 }; });
    return {
      id: String(s.id || uid()),
      seasonNumber: Number(s.seasonNumber) || 1,
      startedAt: String(s.startedAt || ""),
      endedAt: String(s.endedAt || ""),
      targetScore: Number(s.targetScore) || 20,
      teams: teams,
      finalScores: finalScores,
      winnerTeamId: s.winnerTeamId ? String(s.winnerTeamId) : null,
      winnerName: String(s.winnerName || ""),
      gamesCount: Number(s.gamesCount) || (Array.isArray(s.games) ? s.games.length : 0),
      games: normalizePubgGames(s.games)
    };
  }

  // data.pubg가 아예 없는 경우(이 기능이 생기기 전에 저장된 기존 app_state)도
  // 오류 없이 기본값 { currentSeason: null, seasons: [] }로 채운다.
  function applyRemotePubg(pubgData) {
    var d = pubgData || {};
    state.pubg = {
      currentSeason: d.currentSeason ? normalizePubgCurrentSeason(d.currentSeason) : null,
      seasons: Array.isArray(d.seasons) ? d.seasons.map(normalizePubgHistoryEntry) : []
    };
  }

  /* ==========================================================
     PUBG 킬내기 — 화면 렌더링
     ========================================================== */

  function renderPubgSetup() {
    var total = pubgDraftTotalParticipants();
    var html = '<div class="pubg-card">';
    html += '<div class="pubg-card-title">① 팀 추가 &amp; 인원 구성</div>';
    html += '<div class="pubg-draft-team-list">';
    pubgDraftTeams.forEach(function (t) {
      html += '<div class="pubg-draft-team" data-team-id="' + t.id + '">';
      html += '<div class="pubg-draft-team-head">';
      html += '<div class="crest" style="' + crestStyle(t.name || "?") + '">' + escapeHtml(initials(t.name || "?")) + '</div>';
      html += '<input class="name-input" data-role="pubg-draft-team-name" data-team-id="' + t.id +
        '" placeholder="팀 이름 (예: 레드팀)" value="' + escapeHtml(t.name) + '" maxlength="14" />';
      html += '<button class="delete-btn" data-role="pubg-delete-team" data-team-id="' + t.id + '" type="button">팀 삭제</button>';
      html += '</div>';

      html += '<div class="pubg-member-list">';
      if (!t.members.length) {
        html += '<div class="pubg-member-empty">아직 인원이 없어요.</div>';
      }
      t.members.forEach(function (m) {
        html += '<div class="pubg-member-row" data-member-id="' + m.id + '">';
        html += '<input class="name-input" data-role="pubg-draft-member-name" data-team-id="' + t.id +
          '" data-member-id="' + m.id + '" placeholder="참가자 이름" value="' + escapeHtml(m.name) + '" maxlength="12" />';
        if (pubgDraftTeams.length > 1) {
          html += '<select class="pubg-member-move" data-role="pubg-draft-member-move" data-team-id="' + t.id + '" data-member-id="' + m.id + '">';
          pubgDraftTeams.forEach(function (other) {
            html += '<option value="' + other.id + '"' + (other.id === t.id ? ' selected' : '') + '>' +
              escapeHtml(other.name || "(이름 없음)") + '</option>';
          });
          html += '</select>';
        }
        html += '<button class="delete-btn" data-role="pubg-delete-member" data-team-id="' + t.id +
          '" data-member-id="' + m.id + '" type="button">삭제</button>';
        html += '</div>';
      });
      html += '</div>';

      html += '<button class="pubg-add-member-btn" data-role="pubg-add-member" data-team-id="' + t.id + '" type="button">+ 인원 추가</button>';
      html += '</div>';
    });
    html += '</div>';
    html += '<button class="pubg-add-team-btn" data-role="pubg-add-team" type="button">+ 팀 추가</button>';

    html += '<div class="pubg-total-line"><span>전체 참가 인원</span><b>' + total + '명</b></div>';

    html += '<div class="pubg-card-title">② 목표 점수</div>';
    html += '<input class="stat-input pubg-target-input" type="number" inputmode="numeric" id="pubgTargetInput" value="' +
      escapeHtml(pubgDraftTarget) + '" />';

    if (pubgSetupError) html += '<div class="match-error">' + escapeHtml(pubgSetupError) + '</div>';

    html += '<div class="action-row"><button class="match-btn" data-role="pubg-start-season" type="button">시즌 시작</button></div>';
    html += '</div>';
    return html;
  }

  function pubgTeamRow(team, season, rank, isLead) {
    var score = season.scores[team.id] || 0;
    var pct = Math.max(0, Math.min(100, Math.round((score / season.targetScore) * 100)));
    var gameCount = (season.teamGameCounts && season.teamGameCounts[team.id]) || 0;
    var html = '<div class="pubg-team-row' + (isLead ? ' lead' : '') + '">';
    html += '<div class="pubg-team-row-top">';
    html += '<div class="pubg-team-rank">' + rank + '</div>';
    html += '<div class="crest" style="' + crestStyle(team.name) + '">' + escapeHtml(initials(team.name)) + '</div>';
    html += '<div class="pubg-team-info">';
    html += '<div class="pubg-team-name">' + escapeHtml(team.name) + '</div>';
    html += '<div class="pubg-team-members">' + escapeHtml(pubgTeamNames(team.members)) + ' · ' + gameCount + '게임 진행</div>';
    html += '</div>';
    html += '<div class="pubg-team-score">' + score + '<span class="pubg-target">/' + season.targetScore + '</span></div>';
    html += '</div>';
    html += '<div class="progress-track"><div class="progress-fill" style="width:' + pct + '%"></div></div>';
    if (season.status !== "won") {
      html += '<div class="action-row"><button class="pubg-team-entry-btn" data-role="pubg-open-entry" data-team-id="' + team.id + '" type="button">' +
        ICON_MATCH + ' ' + escapeHtml(team.name) + ' 결과 입력</button></div>';
    }
    html += '</div>';
    return html;
  }

  function renderPubgScoreboard(season) {
    var maxScore = Math.max.apply(null, season.teams.map(function (t) { return season.scores[t.id] || 0; }));
    var ranked = season.teams.slice().sort(function (a, b) { return (season.scores[b.id] || 0) - (season.scores[a.id] || 0); });
    var html = '<div class="pubg-scoreboard">';
    ranked.forEach(function (t, i) {
      var score = season.scores[t.id] || 0;
      html += pubgTeamRow(t, season, i + 1, score === maxScore);
    });
    html += '</div>';
    return html;
  }

  function renderPubgWinBanner(season) {
    var winnerTeam = season.teams.find(function (t) { return t.id === season.winnerTeamId; }) || { name: "", members: [] };
    var scoreLine = season.teams.map(function (t) { return t.name + " " + (season.scores[t.id] || 0); }).join(" · ");
    var html = '<div class="pubg-win-banner">';
    html += trophySvg("modal-trophy");
    html += '<div class="pubg-win-title">🏆 ' + escapeHtml(winnerTeam.name) + ' 승리!</div>';
    html += '<div class="pubg-win-members">' + escapeHtml(pubgTeamNames(winnerTeam.members)) + '</div>';
    html += '<div class="pubg-win-score">최종 점수 · ' + escapeHtml(scoreLine) + '</div>';
    html += '<div class="pubg-win-target">목표 점수 ' + season.targetScore + '</div>';
    html += '<div class="action-row"><button class="end-btn" data-role="pubg-archive-season" type="button">' +
      trophySvg("") + '시즌 결과 저장</button></div>';
    html += '</div>';
    return html;
  }

  // 시즌 종료(승리) 시점과 시즌 기록 상세보기에서 함께 쓰는 "개인 기록" 패널 —
  // 그 시즌 전체 게임을 합산해 킬 1등/꼴등을 보여준다(동률이면 여러 명).
  function renderPubgKillLeadersPanel(teams, games) {
    var kl = pubgPlayerKillLeaders(teams, games);
    if (!kl.top.length) return "";
    function chip(p, cls, label) {
      return '<div class="kill-chip ' + cls + '"><span class="kill-chip-label">' + label + '</span>' +
        '<span class="kill-chip-name">' + escapeHtml(p.name) + '</span>' +
        '<span class="kill-chip-team">' + escapeHtml(p.teamName) + '</span>' +
        '<span class="kill-chip-count">' + p.kills + '킬</span></div>';
    }
    var html = '<div class="pubg-kill-leaders">';
    html += '<div class="pubg-kill-leaders-title">개인 기록</div>';
    html += '<div class="kill-chip-group">';
    kl.top.forEach(function (p) { html += chip(p, "top", "킬 1등"); });
    kl.bottom.forEach(function (p) { html += chip(p, "bottom", "킬 꼴등"); });
    html += '</div></div>';
    return html;
  }

  // 게임 기록 목록 — 팀마다 자기 게임을 자기 속도로 따로 쌓으므로, 한 카드가
  // "어느 한 팀의 게임 한 판"을 나타낸다(예전처럼 모든 팀의 결과를 한 카드에
  // 같이 보여주지 않는다). 최신 입력이 위로 오도록 역순으로 나열한다.
  function renderPubgGameList(season) {
    if (!season.games.length) return '<div class="empty">아직 입력된 게임이 없어요.</div>';
    var teamById = {};
    season.teams.forEach(function (t) { teamById[t.id] = t; });
    var html = '<div class="match-list-title">게임 기록 <span class="tab-count">' + season.games.length + '</span></div>';
    html += '<div class="pubg-game-list">';
    season.games.slice().reverse().forEach(function (g) {
      var team = teamById[g.teamId];
      if (!team) return; // 팀이 사라진 옛 데이터 방어
      var byMember = {};
      (g.players || []).forEach(function (p) { byMember[p.memberId] = p.kills; });
      var teamKills = (g.players || []).reduce(function (sum, p) { return sum + (Number(p.kills) || 0); }, 0);
      var s = pubgGameScore((team.members || []).length, teamKills, g.bonus);
      var perPlayer = (team.members || []).map(function (m) { return m.name + " " + (byMember[m.id] || 0); }).join(" · ");
      html += '<div class="pubg-game-card">';
      html += '<div class="pubg-game-num"><div class="crest" style="' + crestStyle(team.name) + '">' + escapeHtml(initials(team.name)) + '</div>' +
        '<span>' + escapeHtml(team.name) + ' · GAME ' + g.teamGameNumber + '</span></div>';
      html += '<div class="pubg-game-teams">';
      html += '<div class="pubg-game-team"><span>킬 ' + teamKills + ' · 추가 ' + (g.bonus > 0 ? "+" : "") + g.bonus + '</span>' +
        '<span class="pubg-game-score' + (s < 0 ? ' neg' : '') + '">' + (s > 0 ? "+" : "") + s + '</span></div>';
      if (perPlayer) html += '<div class="pubg-game-team-players">' + escapeHtml(perPlayer) + '</div>';
      html += '</div>';
      if (confirmDeletePubgGameId === g.id) {
        html += '<div class="confirm-row">이 게임 기록을 삭제할까요? ' +
          '<button class="confirm-yes" data-role="pubg-confirm-delete-game" data-id="' + g.id + '" type="button">삭제</button>' +
          '<button class="confirm-no" data-role="pubg-cancel-delete-game" type="button">취소</button></div>';
      } else {
        html += '<div class="row-actions">' +
          '<button class="delete-btn" data-role="pubg-delete-game" data-id="' + g.id + '" type="button">삭제</button>' +
          '<button class="edit-btn" data-role="pubg-edit-entry" data-id="' + g.id + '" data-team-id="' + team.id + '" type="button">수정</button>' +
          '</div>';
      }
      html += '</div>';
    });
    html += '</div>';
    return html;
  }

  // 게임 결과 입력/수정 모달 — 항상 팀 하나만을 대상으로 한다.
  function renderPubgEntryModal(season) {
    var team = season.teams.find(function (t) { return t.id === pubgEntryModalTeamId; });
    if (!team) return "";
    var killsByMember = pubgEntryKills;
    var bonus = pubgEntryBonus;
    var totalKills = (team.members || []).reduce(function (sum, m) {
      var k = parseInt(killsByMember[m.id], 10);
      return sum + (isNaN(k) ? 0 : k);
    }, 0);
    var preview = pubgGameScore((team.members || []).length, totalKills, bonus);
    var gameNumLabel = pubgEntryModalEditId
      ? "GAME " + ((season.games.find(function (g) { return g.id === pubgEntryModalEditId; }) || {}).teamGameNumber || "") + " 수정"
      : "GAME " + (((season.teamGameCounts && season.teamGameCounts[team.id]) || 0) + 1) + " 결과 입력";

    var html = '<div class="modal-overlay" data-role="pubg-entry-modal-backdrop">';
    html += '<div class="modal-card" role="dialog" aria-modal="true" aria-label="게임 결과 입력">';
    html += '<div class="modal-field"></div><div class="modal-inner">';
    html += ICON_MATCH.replace('<svg ', '<svg class="modal-match-icon" ');

      html += '</div>';

      html += '<div class="pubg-history-vs">';
      s.finalScores.forEach(function (f) {
        var isChamp = f.teamId === s.winnerTeamId;

        html += '<div class="pubg-history-team-row' + (isChamp ? ' champ' : '') + '">' +

          '<span class="pubg-history-team-name">' + escapeHtml(team.name) + ' · ' + escapeHtml(pubgTeamNames(team.members)) + '</span>' +

        html += '<div class="pubg-history-games">';
        // 팀마다 자기 게임을 따로 쌓았으므로, 여기서도 "어느 팀의 몇 번째
        // 게임"인지 한 줄씩 최신순으로 보여준다(모든 팀이 같은 게임 수를
        // 하지 않아도 그대로 보인다).
        s.games.slice().reverse().forEach(function (g) {

      '<button class="tab-btn' + (pubgActiveTab === "history" ? " active" : "") + '" data-role="pubg-tab-history" type="button">시즌 기록' +

    var archiveBtn = pubgAppEl.querySelector('[data-role="pubg-archive-season"]');
    if (archiveBtn) archiveBtn.addEventListener("click", archivePubgSeason);

    if (pubgEntryModalOpen && state.pubg.currentSeason) {
      var season = state.pubg.currentSeason;

      var backdrop = pubgAppEl.querySelector('[data-role="pubg-entry-modal-backdrop"]');
      if (backdrop) {
        backdrop.addEventListener("click", function (e) { if (e.target === backdrop) closePubgEntryModal(); });
      }
      var closeBtn = pubgAppEl.querySelector('[data-role="pubg-close-entry-modal"]');
      if (closeBtn) closeBtn.addEventListener("click", closePubgEntryModal);

      if (team) {
        var teamCount = (team.members || []).length;
        var killInputs = pubgAppEl.querySelectorAll('[data-role="pubg-game-player-kills-input"]');
        var bonusInput = pubgAppEl.querySelector('[data-role="pubg-game-bonus-input"]');

        var totalKillsEl = pubgAppEl.querySelector('[data-role="pubg-game-team-kills-total"]');

          var k = 0;
          killInputs.forEach(function (el) {

          var b = parseInt(bonusInput ? bonusInput.value : "0", 10); if (isNaN(b)) b = 0;
          var val = -teamCount + k + b;
          if (totalKillsEl) totalKillsEl.textContent = k;
          if (previewEl) {
            previewEl.textContent = (val > 0 ? "+" : "") + val;

          }
        };
        killInputs.forEach(function (el) {
          var memberId = el.getAttribute("data-member-id");
          el.addEventListener("input", function () {
            pubgEntryKills[memberId] = el.value;
            updatePreview();
          });
        });
        if (bonusInput) {
          bonusInput.addEventListener("input", function () {
            pubgEntryBonus = bonusInput.value;
            updatePreview();
          });
        }
      }

      var saveBtn = pubgAppEl.querySelector('[data-role="pubg-save-entry"]');
      if (saveBtn) saveBtn.addEventListener("click", savePubgEntryResult);
    }

    // ---- 시즌 기록 ----
    pubgAppEl.querySelectorAll('[data-role="pubg-history-toggle"]').forEach(function (el) {
      el.addEventListener("click", function () {
        var id = el.getAttribute("data-id");

        renderPubg();

    pubgAppEl.querySelectorAll('[data-role="pubg-delete-history"]').forEach(function (el) {
      el.addEventListener("click", function (e) {

        confirmDeletePubgHistoryId = el.getAttribute("data-id");
        renderPubg();
      });
    });
    pubgAppEl.querySelectorAll('[data-role="pubg-cancel-delete-history"]').forEach(function (el) {
      el.addEventListener("click", function (e) {
        e.stopPropagation();
        confirmDeletePubgHistoryId = null;
        renderPubg();
      });
    });
    pubgAppEl.querySelectorAll('[data-role="pubg-confirm-delete-history"]').forEach(function (el) {
      el.addEventListener("click", function (e) {
        e.stopPropagation();
        deletePubgHistoryEntry(el.getAttribute("data-id"));
      });
    });
  }

  /* ==========================================================
     🎲 순서 정하기 — 데이터 로직 + 화면
     football/pubg와 완전히 독립된 state.randomOrder만 읽고 쓴다.
     ========================================================== */

  function randomHasResult() {
    return !!(state.randomOrder.result && state.randomOrder.result.length);
  }

  function randomAddParticipant() {
    // 새로 추가된 입력칸에 자동으로 포커스를 주지 않는다 — 이 버튼은(팀 구성
    // 화면의 "+ 인원 추가"처럼) 목록이 늘어날 때마다 버튼 자체의 위치가 아래로
    // 밀리는 인라인 버튼이라, 포커스를 옮기면 그 직후의 blur가 곧바로 재렌더를
    // 일으켜 "+ 인원 추가"를 연달아 누를 때 클릭이 씹히는 경우가 생길 수 있다
    // (고정 위치인 팀 추가 FAB과 달리 이 버튼은 위치가 계속 바뀌기 때문).
    state.randomOrder.participants.push({ id: uid(), name: "" });
    randomError = "";
    persist();
    renderRandom();
  }

  function randomDeleteParticipant(id) {
    state.randomOrder.participants = state.randomOrder.participants.filter(function (p) { return p.id !== id; });
    // 참가자가 사라지면 이미 만들어진 결과에서도 그 사람을 함께 제거한다 —
    // 배열에서 그냥 빼기만 하면 남은 사람들의 순번은 렌더링할 때(인덱스+1)
    // 자동으로 1번부터 다시 매겨진다.
    if (state.randomOrder.result && state.randomOrder.result.length) {
      state.randomOrder.result = state.randomOrder.result.filter(function (pid) { return pid !== id; });
    }
    persist();
    renderRandom();
  }

  // Fisher-Yates shuffle: 뒤에서부터 아직 안 뽑힌 구간(0..i) 안에서 무작위
  // 인덱스를 골라 자리를 맞바꾼다 — 모든 순열이 동일한 확률로 나오는 표준 방식.
  function fisherYatesShuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = a[i];
      a[i] = a[j];
      a[j] = tmp;
    }
    return a;
  }

  function randomShuffle() {
    if (state.randomOrder.participants.length < 2) {
      randomError = "순서를 정하려면 최소 2명이 필요합니다.";
      renderRandom();
      return;
    }
    randomError = "";
    var ids = state.randomOrder.participants.map(function (p) { return p.id; });
    state.randomOrder.result = fisherYatesShuffle(ids);
    persist();
    renderRandom();
  }

  function randomResetResult() {
    state.randomOrder.result = [];
    persist();
    renderRandom();
  }

  function randomClearAll() {
    state.randomOrder.participants = [];
    state.randomOrder.result = [];
    randomError = "";
    persist();
    renderRandom();
  }

  function renderRandom() {
    if (!randomAppEl) return;
    var participants = state.randomOrder.participants;
    var result = state.randomOrder.result || [];
    var byId = {};
    participants.forEach(function (p) { byId[p.id] = p; });

      html += '<div class="empty">아직 참가자가 없어요.</div>';
    } else {
      html += '<div class="pubg-member-list">';
      participants.forEach(function (p) {
        html += '<div class="pubg-member-row" data-participant-id="' + p.id + '">';
        html += '<input class="name-input" data-role="random-participant-name" data-id="' + p.id +
          '" placeholder="참가자 이름" value="' + escapeHtml(p.name) + '" maxlength="12" />';
        html += '<button class="delete-btn" data-role="random-delete-participant" data-id="' + p.id + '" type="button">삭제</button>';
        html += '</div>';
      });
      html += '</div>';
    }
    html += '<button class="pubg-add-member-btn" data-role="random-add-participant" type="button">+ 인원 추가</button>';

    if (randomError) html += '<div class="match-error">' + escapeHtml(randomError) + '</div>';

    html += '<div class="action-row"><button class="match-btn" data-role="random-shuffle" type="button">' +
      (randomHasResult() ? "다시 돌리기" : "순서 랜덤으로 정하기") + '</button></div>';

    if (participants.length > 0 || result.length > 0) {
      html += '<div class="action-row"><button class="delete-btn" data-role="random-clear-all" type="button">전체 비우기</button></div>';
    }
    html += '</div>';

    if (result.length > 0) {
      html += '<div class="pubg-card">';
      html += '<div class="pubg-card-title">랜덤 결과</div>';
      html += '<div class="random-result-list">';
      result.forEach(function (pid, i) {
        var p = byId[pid];
        if (!p) return; // 방어적 처리 — 정상 흐름에서는 항상 존재(삭제 시 결과에서도 함께 제거됨)
        html += '<div class="random-result-row' + (i === 0 ? ' first-place' : '') + '">';
        html += '<div class="random-result-rank">' + (i + 1) + '</div>';
        html += '<div class="random-result-name">' + escapeHtml(p.name || "이름 없음") + '</div>';
        html += (i === 0 ? '<span class="random-crown">👑</span>' : '');
        html += '</div>';
      });
      html += '</div>';
      html += '<div class="action-row"><button class="delete-btn" data-role="random-reset-result" type="button">결과 초기화</button></div>';
      html += '</div>';
    }

    randomAppEl.innerHTML = html;
    wireRandomEvents();
  }

  function wireRandomEvents() {
    var addParticipantBtn = randomAppEl.querySelector('[data-role="random-add-participant"]');
    if (addParticipantBtn) addParticipantBtn.addEventListener("click", randomAddParticipant);

    randomAppEl.querySelectorAll('[data-role="random-participant-name"]').forEach(function (el) {
      el.addEventListener("click", function (e) { e.stopPropagation(); });
      el.addEventListener("blur", function () {
        var id = el.getAttribute("data-id");
        var p = state.randomOrder.participants.find(function (x) { return x.id === id; });
        if (!p) return;
        // 앞뒤 공백 제거, 공백만 입력한 경우는 허용하지 않고 기본 표시로 대체.
        // 이름이 중복되는 건 문제 없다(내부 식별은 이름이 아니라 id로 한다).
        var v = el.value.trim() || "이름 없음";
        if (v !== p.name) {
          p.name = v;
          persist();
          renderRandom();
        }
      });
    });

    randomAppEl.querySelectorAll('[data-role="random-delete-participant"]').forEach(function (el) {
      el.addEventListener("click", function () {
        randomDeleteParticipant(el.getAttribute("data-id"));
      });
    });

    var shuffleBtn = randomAppEl.querySelector('[data-role="random-shuffle"]');
    if (shuffleBtn) shuffleBtn.addEventListener("click", randomShuffle);

    var resetResultBtn = randomAppEl.querySelector('[data-role="random-reset-result"]');
    if (resetResultBtn) resetResultBtn.addEventListener("click", randomResetResult);

    var clearAllBtn = randomAppEl.querySelector('[data-role="random-clear-all"]');
    if (clearAllBtn) clearAllBtn.addEventListener("click", randomClearAll);
  }

  /* ==========================================================
     모드 전환 (⚽ MNM FOOTBALL ↔ 🎯 PUBG 킬내기 ↔ 🎲 순서 정하기)
     ========================================================== */

  var modeBtnSoccer = document.getElementById("modeBtnSoccer");
  var modeBtnPubg = document.getElementById("modeBtnPubg");
  var modeBtnRandom = document.getElementById("modeBtnRandom");

  function switchMode(mode) {
    currentMode = mode;
    if (modeBtnSoccer) modeBtnSoccer.classList.toggle("active", mode === "soccer");
    if (modeBtnPubg) modeBtnPubg.classList.toggle("active", mode === "pubg");
    if (modeBtnRandom) modeBtnRandom.classList.toggle("active", mode === "random");
    if (appEl) appEl.style.display = mode === "soccer" ? "" : "none";
    if (pubgAppEl) pubgAppEl.style.display = mode === "pubg" ? "" : "none";
    if (randomAppEl) randomAppEl.style.display = mode === "random" ? "" : "none";
    if (mode === "soccer") {
      render(); // 축구 render()가 activeTab에 맞춰 addBtn 표시 여부를 알아서 정함
    } else {
      if (addBtn) addBtn.style.display = "none"; // FAB(+팀 추가)는 축구 전용
      if (mode === "pubg") renderPubg();
      else renderRandom();
    }
  }
  if (modeBtnSoccer) modeBtnSoccer.addEventListener("click", function () { switchMode("soccer"); });
  if (modeBtnPubg) modeBtnPubg.addEventListener("click", function () { switchMode("pubg"); });
  if (modeBtnRandom) modeBtnRandom.addEventListener("click", function () { switchMode("random"); });

  // 초기 로드·원격 동기화 시점에 축구/PUBG/순서 정하기 화면을 함께 최신화하되,
  // 현재 보고 있는 모드가 축구가 아니라면 축구 render()가 되살린 FAB을 다시 숨긴다.
  function renderBoth() {
    render();
    renderPubg();
    renderRandom();
    if (currentMode !== "soccer" && addBtn) addBtn.style.display = "none";
  }

  renderBoth();

  /* ==========================================================
     로그인 / 회원가입 — 계정별로 완전히 분리된 데이터
     ========================================================== */
  // app_state는 이제 user_id(로그인한 계정의 auth.uid())로 구분되는, 계정당
  // 하나씩의 행을 갖는다. startAppForUser(session)은 로그인에 성공할 때마다
  // 호출되고, "지금 로드된 계정"과 "방금 로그인한 계정"이 다르면(계정 전환)
  // 화면의 모든 상태를 먼저 깨끗하게 리셋한 다음 그 계정의 데이터를 새로
  // 불러온다 — 그래야 로그아웃 직후 다른 계정으로 들어갔을 때 이전 계정의
  // 팀/시즌 기록이 한순간이라도 화면에 남지 않는다.

  function resetAppStateToDefault() {
    // 계정을 전환하거나 로그아웃할 때, 화면과 메모리에 남아있는 "이전
    // 사용자"의 모든 흔적을 지운다 — 여기 나열된 값들은 전부 저장되는
    // 데이터(state)이거나, 저장되진 않지만 특정 팀/시즌/모달을 가리키는
    // 화면 상태라서 계정이 바뀌면 반드시 초기화해야 한다.
    state.leagueName = "MNM Premier League";
    state.teams = [{ id: uid(), name: "", w: 0, d: 0, l: 0, gf: 0, ga: 0, color: null }];
    state.matches = [];
    state.allMatches = [];
    state.pubg = { currentSeason: null, seasons: [] };
    state.randomOrder = { participants: [], result: [] };
    randomError = "";
    exampleMode = true;
    openId = null;
    confirmDeleteId = null;
    championModalOpen = false;
    activeTab = "current";
    historyList = [];
    historyLoaded = false;
    openHistoryId = null;
    confirmDeleteHistoryId = null;
    historyVisibleCount = HISTORY_PAGE_SIZE;
    matchModalOpen = false;
    matchTeamA = "";
    matchTeamB = "";
    matchScoreA = "";
    matchScoreB = "";
    matchError = "";
    confirmDeleteMatchId = null;
    currentMode = "soccer";
    pubgActiveTab = "current";
    pubgDraftTeams = [];
    pubgDraftTarget = "20";
    pubgSetupError = "";
    pubgEntryModalOpen = false;
    pubgEntryModalTeamId = null;
    pubgEntryModalEditId = null;
    pubgEntryKills = {};
    pubgEntryBonus = "";
    pubgEntryError = "";
    confirmDeletePubgGameId = null;
    openPubgHistoryId = null;
    confirmDeletePubgHistoryId = null;
  }

  // startAppForUser()는 "이 계정의 데이터를 리셋 -> 조회 -> 적용까지 전부 끝냈다"는
  // 사실을 나타내는 Promise를 돌려준다. handleAuthSession()은 반드시 이 Promise가
  // 끝날 때까지 기다린 다음에만 화면(mainUI)을 보여줘야, 로그인 직후나 계정 전환
  // 시 이전 화면 -> 빈 화면 -> 새 데이터 순으로 깜빡이는 현상이 생기지 않는다.
  // startAppForUserPromise*는 "지금 이 계정에 대한 로드가 이미 진행 중이거나
  // 막 끝났다"는 상태를 기억해서, getSession()/onAuthStateChange가 같은 세션에
  // 대해 거의 동시에 handleAuthSession을 두 번 호출하더라도 실제 조회/리셋은
  // 한 번만 일어나고, 나중 호출은 먼저 시작된 바로 그 로드가 끝나기를 함께
  // 기다리게 만든다(그렇지 않으면 두 번째 호출이 "이미 currentUserId가 같으니
  // 끝났다"고 착각해 데이터가 채 안 들어온 상태로 곧장 화면을 보여줄 수 있다).
  var startAppForUserPromise = null;
  var startAppForUserPromiseUserId = null;

  function startAppForUser(session) {
    var userId = session.user.id;
    if (startAppForUserPromiseUserId === userId && startAppForUserPromise) {
      return startAppForUserPromise; // 이미 이 계정 로드가 진행 중이거나 끝남 — 그 결과를 함께 기다림
    }
    startAppForUserPromiseUserId = userId;
    startAppForUserPromise = (async function () {
      resetAppStateToDefault(); // 1) 이전 계정(또는 초기 상태)의 흔적을 먼저 지움
      currentUserId = userId; // 2) 이 계정을 "현재 로딩 중/로딩됨" 계정으로 표시
      renderBoth(); // mainUI는 아직 숨겨진 상태이므로(로딩 화면 표시 중) 화면엔 보이지 않음

      // Safety net: whatever else happens, never leave "불러오는 중" stuck forever.
      setTimeout(function () {
        if (currentUserId === userId && !historyLoaded) {
          historyLoaded = true;
          renderBoth();
        }
      }, 8000);

      if (!supabaseClient) {
        // SUPABASE_KEY가 비어있거나 CDN을 못 불러온 경우: 로컬 전용으로 동작
        historyLoaded = true;
        renderBoth();
        return;
      }

      try {
        var res = await supabaseClient.from("app_state").select("data").eq("user_id", userId).maybeSingle(); // 3) 조회
        if (currentUserId !== userId) return; // 그 사이 로그아웃했거나 다른 계정으로 바뀜
        if (res.error) throw res.error;
        if (res.data && res.data.data) {
          applyRemote(res.data.data); // 4) 데이터가 있으면 적용
        } else {
          // 5) 이 계정으로 처음 로그인한 경우: 지금 상태(빈 팀 1개)로 이 계정
          // 전용 행을 새로 만들어둔다. user_id에 UNIQUE 제약이 있으므로
          // onConflict: "user_id"를 쓰면 실수로 같은 계정 행이 두 개
          // 생기는 일도 없다.
          await Promise.resolve(
            supabaseClient.from("app_state").upsert(
              { user_id: userId, data: toDocBody(), updated_at: new Date().toISOString() },
              { onConflict: "user_id" }
            )
          ).catch(function () {});
        }
      } catch (e) {
        /* 최초 로드 실패: 로컬 기본 상태를 유지하고, 다음 편집 때 다시 저장을 시도함 */
      }
      if (currentUserId !== userId) return;
      historyLoaded = true; // 6)
      renderBoth(); // 7)

      // 실시간 동기화: 같은 계정으로 로그인한 다른 기기/브라우저에서 저장한
      // 내용이 이 화면에도 바로 반영된다. filter가 user_id 기준이라 다른
      // 계정의 변경사항은 애초에 이 채널로 들어오지 않는다.
      subscribeRealtime(userId);
    })();
    return startAppForUserPromise;
  }

  function subscribeRealtime(userId) {
    unsubscribeRealtime();
    if (!supabaseClient || !userId) return;
    try {
      realtimeChannel = supabaseClient
        .channel("app_state_sync_" + userId)
        .on(
          "postgres_changes",
          { event: "*", schema: "public", table: "app_state", filter: "user_id=eq." + userId },
          function (payload) {
            if (currentUserId !== userId) return; // 그 사이 로그아웃/다른 계정으로 전환됨
            var row = payload && payload.new;
            if (!row || !row.data) return;
            applyRemote(row.data);
            // 내 write도 이 채널로 그대로 되돌아오므로, 그 팀이 실제로 사라졌을
            // 때만(다른 기기에서 삭제됐을 때만) 열려있던 패널을 닫음 — 매번
            // 무조건 닫으면 편집 직후 패널이 바로 닫혀버림.
            if (openId && !state.teams.some(function (t) { return t.id === openId; })) {
              openId = null;
            }
            if (confirmDeleteId && !state.teams.some(function (t) { return t.id === confirmDeleteId; })) {
              confirmDeleteId = null;
            }
            renderBoth();
          }
        )
        .subscribe();
    } catch (e) {
      /* 실시간 채널 연결 실패: 이 탭은 계속 동작하되, 다른 기기의 변경사항만 실시간으로 못 받음 */
    }
  }

  function unsubscribeRealtime() {
    if (realtimeChannel && supabaseClient) {
      try { supabaseClient.removeChannel(realtimeChannel); } catch (e) {}
    }
    realtimeChannel = null;
  }

  function wireAuthEvents() {
    var usernameInput = authScreenEl.querySelector('[data-role="auth-username"]');
    var passwordInput = authScreenEl.querySelector('[data-role="auth-password"]');
    var passwordConfirmInput = authScreenEl.querySelector('[data-role="auth-password-confirm"]');
    if (usernameInput) {
      usernameInput.addEventListener("input", function () { authUsername = usernameInput.value; });
      usernameInput.addEventListener("keydown", function (e) { if (e.key === "Enter") submitAuthForm(); });
    }
    if (passwordInput) {
      passwordInput.addEventListener("input", function () { authPassword = passwordInput.value; });
      passwordInput.addEventListener("keydown", function (e) { if (e.key === "Enter") submitAuthForm(); });
    }
    if (passwordConfirmInput) {
      passwordConfirmInput.addEventListener("input", function () { authPasswordConfirm = passwordConfirmInput.value; });
      passwordConfirmInput.addEventListener("keydown", function (e) { if (e.key === "Enter") submitAuthForm(); });
    }
    var submitBtn = authScreenEl.querySelector('[data-role="auth-submit"]');
    if (submitBtn) submitBtn.addEventListener("click", submitAuthForm);
    var toggleBtn = authScreenEl.querySelector('[data-role="auth-toggle"]');
    if (toggleBtn) {
      toggleBtn.addEventListener("click", function () {
        authMode = authMode === "signup" ? "login" : "signup";
        authError = "";
        authInfo = "";
        authPasswordConfirm = "";
        renderAuthScreen();
      });
    }
  }

  function translateAuthError(msg) {
    msg = msg || "";
    if (/already registered|already exists/i.test(msg)) return "이미 사용 중인 아이디입니다.";
    if (/invalid login credentials/i.test(msg)) return "아이디 또는 비밀번호가 올바르지 않습니다.";
    if (/password should be at least|password.*length/i.test(msg)) return "비밀번호는 6자 이상이어야 합니다.";
    if (/unable to validate email|invalid email/i.test(msg)) return "아이디는 영문/숫자/밑줄(_)/하이픈(-)만 사용해 2~20자로 입력해주세요.";
    return "요청 처리 중 문제가 발생했습니다. 잠시 후 다시 시도해주세요.";
  }

  async function submitAuthForm() {
    if (authLoading) return;
    authError = "";
    authInfo = "";
    var username = (authUsername || "").trim(); // 아이디 앞뒤 공백 제거
    var password = authPassword || "";
    var isSignup = authMode === "signup";

    if (!username || !password || (isSignup && !authPasswordConfirm)) {
      authError = "아이디와 비밀번호를 모두 입력해주세요.";
      renderAuthScreen();
      return;
    }
    if (!AUTH_USERNAME_RE.test(username)) {
      authError = "아이디는 영문/숫자/밑줄(_)/하이픈(-)만 사용해 2~20자로 입력해주세요.";
      renderAuthScreen();
      return;
    }
    if (password.length < 6) {
      authError = "비밀번호는 6자 이상이어야 합니다.";
      renderAuthScreen();
      return;
    }
    if (isSignup && password !== authPasswordConfirm) {
      authError = "비밀번호가 일치하지 않습니다.";
      renderAuthScreen();
      return;
    }
    if (!supabaseClient) {
      authError = "서버 연결 설정이 안 되어 있습니다. (SUPABASE_KEY 확인)";
      renderAuthScreen();
      return;
    }

    authLoading = true;
    renderAuthScreen();
    var authEmail = usernameToAuthEmail(username);

    try {
      if (isSignup) {
        var res = await supabaseClient.auth.signUp({ email: authEmail, password: password });
        if (res.error) throw res.error;

        // profiles 테이블에 (id, username)을 기록해 아이디를 한 번 더
        // UNIQUE로 보호한다(비밀번호는 여기 저장하지 않음 — Supabase Auth만
        // 비밀번호를 다룬다). "Confirm email"이 꺼져 있어야 signUp 직후
        // 세션이 바로 생기고, 그래야 아래 insert가 RLS(auth.uid() = id)를
        // 통과한다.
        if (res.data && res.data.user) {
          var profileRes = await supabaseClient.from("profiles").insert({ id: res.data.user.id, username: username });
          if (profileRes.error) {
            // username UNIQUE 위반(동시 가입 등 드문 경쟁 상황) 안전망
            if (/duplicate key|unique constraint/i.test(profileRes.error.message || "")) {
              authLoading = false;
              authError = "이미 사용 중인 아이디입니다.";
              renderAuthScreen();
              return;
            }
          }
        }

        // 가입 직후 자동으로 앱에 들어가지 않고, 안내 메시지를 보여준 뒤
        // "로그인" 화면으로 돌아간다 — signUp 성공 시 세션이 함께 생겼을 수
        // 있으므로(Confirm email이 꺼져 있는 경우) 명시적으로 로그아웃한다.
        // (handleAuthSession의 "로그아웃됨" 분기는 authMode/authInfo를 건드리지
        // 않도록 만들어 두었으므로, 이 signOut()이 뒤늦게 발생시키는
        // SIGNED_OUT 이벤트가 아래에서 지금 막 세팅할 완료 메시지를 지울
        // 걱정은 없다.)
        try { await supabaseClient.auth.signOut(); } catch (e) {}
        authLoading = false;
        authMode = "login";
        authInfo = "회원가입이 완료되었습니다.";
        authPassword = "";
        authPasswordConfirm = "";
        renderAuthScreen();
      } else {
        var res2 = await supabaseClient.auth.signInWithPassword({ email: authEmail, password: password });
        if (res2.error) throw res2.error;
        authLoading = false;
        authPassword = "";
        handleAuthSession(res2.data.session);
      }
    } catch (e) {
      authLoading = false;
      // 로그인 실패 사유는 구분해 알려주지 않고(보안상), 요청된 문구 그대로
      // "아이디 또는 비밀번호가 올바르지 않습니다."로 통일한다.
      authError = isSignup ? translateAuthError(e && e.message) : "아이디 또는 비밀번호가 올바르지 않습니다.";
      renderAuthScreen();
    }
  }

  function showAuthScreen() {
    if (mainUIEl) mainUIEl.style.display = "none";
    if (authScreenEl) authScreenEl.style.display = "flex";
    renderAuthScreen();
  }

  function showMainUI(session) {
    if (authScreenEl) authScreenEl.style.display = "none";
    if (mainUIEl) mainUIEl.style.display = "";
    if (userUsernameLabelEl) userUsernameLabelEl.textContent = authEmailToUsername((session && session.user && session.user.email) || "");
  }

  // 로그인 성공 직후 ~ 그 계정의 app_state 로딩이 끝나기 전까지 보여주는 화면.
  // mainUI는 계속 숨긴 채로 두고(= MNM FOOTBALL/PUBG 화면은 이 시점엔 절대 노출되지
  // 않음), authScreen 자리에 안내 문구만 띄운다.
  function showAccountLoadingScreen() {
    if (mainUIEl) mainUIEl.style.display = "none";
    if (authScreenEl) {
      authScreenEl.style.display = "flex";
      authScreenEl.innerHTML = '<div class="auth-card"><div class="auth-eyebrow">MNM GAMING</div>' +
        '<div class="auth-title">MNM Gaming 데이터를 불러오는 중...</div></div>';
    }
  }

  async function handleAuthSession(session) {
    if (session && session.user) {
      var userId = session.user.id;
      // 진짜 "새 로그인/계정 전환"일 때만 로딩 화면으로 전환한다 — 토큰 자동
      // 갱신처럼 같은 계정에 대해 onAuthStateChange가 다시 호출되는 경우까지
      // 매번 mainUI를 숨겼다 보여주면 그때도 화면이 깜빡이므로, currentUserId와
      // 다른 계정일 때만(=로그인 직후이거나 이전과 다른 계정일 때만) 아래에서
      // mainUI를 가리고 로딩 문구를 띄운다.
      if (userId !== currentUserId) {
        // 절대 순서: 로딩 화면 표시(=mainUI는 계속 숨김) -> 이 계정 데이터를
        // 완전히 리셋/조회/적용 -> 그 모든 게 끝난 뒤에만 showMainUI(). 이 순서를
        // 지켜야 "이전 계정 화면이 잠깐 보였다가 새 계정 데이터로 바뀌는" 깜빡임이
        // 사라진다 — 새 계정 데이터가 준비되기 전에는 화면에 아무 계정의 데이터도
        // 보이지 않는다.
        showAccountLoadingScreen();
      }
      await startAppForUser(session); // 리셋 -> 조회 -> 적용 -> historyLoaded -> renderBoth까지 전부 끝날 때까지 대기
      // 기다리는 동안 로그아웃되었거나 또 다른 계정으로 전환됐다면, 지금 막
      // 로드가 끝난(어쩌면 이미 낡은) 계정 화면을 보여주면 안 된다. 오직 "지금
      // 진짜로 로그인돼 있는 계정"과 일치할 때만 화면을 연다.
      if (currentUserId !== userId) return;
      showMainUI(session); // 데이터 준비가 완전히 끝난 뒤 마지막에만 화면 표시 (이미 보이는 중이면 그대로 유지될 뿐 깜빡이지 않음)
    } else {
      // 로그아웃(또는 세션 없음): 무엇보다 먼저 mainUI를 가려서, 아래에서 상태를
      // 리셋/재렌더하는 동안 이전 계정 데이터가 단 한 프레임도 화면에 남지
      // 않게 한다.
      if (mainUIEl) mainUIEl.style.display = "none";
      unsubscribeRealtime();
      currentUserId = null;
      startAppForUserPromise = null;
      startAppForUserPromiseUserId = null;
      resetAppStateToDefault(); // 로그아웃하면 화면에 남은 계정 데이터를 즉시 지움
      renderBoth(); // mainUI는 이미 숨겨져 있으므로 안전
      // 일부러 authMode/authError/authInfo는 여기서 건드리지 않는다. 이유:
      // signUp() 직후 우리가 스스로 signOut()을 호출하는 흐름에서, 그 결과로
      // (실제 Supabase에서도) onAuthStateChange가 SIGNED_OUT 이벤트를 조금
      // 늦게 여러 번 보낼 수 있는데, 그때마다 여기서 메시지를 지워버리면
      // 방금 띄운 "회원가입이 완료되었습니다." 안내가 사라져버린다. 비밀번호
      // 입력값만 화면에 남지 않도록 지워준다.
      authPassword = "";
      authPasswordConfirm = "";
      showAuthScreen(); // 로그인 화면 표시 (mainUI 숨김을 다시 한 번 보장)
    }
  }

  if (logoutBtnEl) {
    logoutBtnEl.addEventListener("click", async function () {
      if (!supabaseClient) return;
      logoutBtnEl.disabled = true;
      try { await supabaseClient.auth.signOut(); } catch (e) {}
      logoutBtnEl.disabled = false;
    });
  }

  if (!supabaseClient) {
    // SUPABASE_KEY가 비어있거나 CDN을 못 불러온 경우: 로그인 자체가 불가능하므로
    // 안내 문구만 보여준다.
    authError = "서버 연결 설정이 안 되어 있어 로그인할 수 없습니다. (SUPABASE_KEY 확인)";
    showAuthScreen();
  } else {
    // 페이지가 처음 열릴 때 로그인 화면이나 앱 화면이 잠깐이라도 잘못
    // 노출되지 않도록, 세션 확인이 끝나기 전까지는 "불러오는 중" 상태만
    // 보여준다.
    renderAuthLoading();

    // 1) 우선 getSession()으로 지금 이 브라우저에 이미 유효한 Supabase 로그인
    //    세션이 있는지 명시적으로 확인한다(새로고침/재방문 시 자동 로그인).
    supabaseClient.auth.getSession().then(function (res) {
      handleAuthSession(res && res.data && res.data.session);
    });

    // 2) 그 이후의 로그인/로그아웃/토큰 갱신 등 상태 변화는 전부 여기서 받는다.
    //    handleAuthSession은 이미 로그인된 상태를 그대로 유지시키는
    //    idempotent한 처리라, getSession()과 중복 호출돼도 문제 없다.
    supabaseClient.auth.onAuthStateChange(function (event, session) {
      handleAuthSession(session);
    });
  }
})();
</script>
</body>
</html>
